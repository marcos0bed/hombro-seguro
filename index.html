    var ult=i===n-1;
    h+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+an.toFixed(1)+'" height="'+alt.toFixed(1)+
       '" rx="'+Math.min(5,an/2).toFixed(1)+'" fill="url(#bg'+(opts.uid||"b")+')"'+(ult?"":' opacity=".82"')+"/>"+
       '<text x="'+(x+an/2).toFixed(1)+'" y="'+Math.max(10,y-4).toFixed(1)+'" fill="'+(ult?col:"#8E99A8")+
       '" font-size="'+(ult?"10.5":"9")+'" font-weight="'+(ult?"700":"400")+
       '" font-family="ui-monospace,monospace" text-anchor="middle">'+esc(String(f(p[1])))+"</text>"+
       '<text x="'+(x+an/2).toFixed(1)+'" y="'+(H-4)+'" fill="#8E99A8" font-size="8" font-family="ui-monospace,monospace" text-anchor="middle">'+esc(p[0])+"</text>";
  });
  return h+"</svg>";
}

/* ============================ PESTAÑA CARRERA ============================
   Seguimiento de un plan de running hacia una carrera objetivo. Se configura
   con el kv "race": {name, date, km, goal_min, plan:{"2026-08-03":km,...}}.
   Sin ese kv la pestaña no existe.

   La pieza central es la EFICIENCIA AERÓBICA: el ritmo de los rodajes suaves a
   igual pulso. Es lo único que distingue "estoy mejorando" de "estoy acumulando
   kilómetros", y casi ninguna app lo hace porque exige corregir por temperatura:
   con calor el pulso sube 5-15 ppm al mismo ritmo, así que sin esa corrección
   agosto siempre parece peor que octubre aunque no lo sea. */

var PCT_SUAVE = 0.82;        /* por debajo de este % de la FC máx = rodaje suave.
                                Se llamaba RUNEASY y pisaba el ejercicio del mismo
                                nombre en upB: latente, pero latente hasta que no. */
var TEMP_REF = 15;           /* temperatura de referencia para normalizar */
var TEMP_CINTA = 21;         /* una cinta en casa no tiene termómetro, pero tampoco
                                está a 15°: sin esto sus carreras de cinta salían
                                con corrección CERO y parecían mejores de lo que son.
                                Un tercio de sus salidas son en cinta. */
var TEMP_SEG_GRADO = 1.5;    /* s/km que cuesta cada grado por encima de 15 */

function raceCfg(){return S("race",null)}
/* Lo que toca HOY según el plan fechado. Las sesiones de carrera describen la
   progresión de las 15 semanas en general; esto dice qué te toca exactamente
   este día concreto, que es lo que uno quiere ver con las zapatillas puestas. */
/* Un día del plan puede ser una lista de pasos o, cuando además trae nombre
   propio, un objeto {t,p}. El nombre manda sobre el título fijo de la semana:
   el martes se llama "Calidad" siempre, pero en la semana 1 son 25 min suaves
   y el rótulo mentía. Sin plan para ese día se conserva el título fijo, que
   ahí significa "el hueco de la sesión", no lo que toca hacer. */
function planDelDia(dia){
  var R=raceCfg(),d=(R&&R.plan&&R.plan[dia])||null;
  if(d&&!Array.isArray(d)&&typeof d==="object")return d.p||null;
  return d;
}
/* El título del plan solo vale si ese día se corre. Sin esta comprobación, al
   mover el rodaje de sitio con las flechas la sesión de pesas que ocupa su
   hueco se quedaba con el rótulo de la carrera: el jueves ponía "Rodaje suave
   30 min" encima de Lower B. */
function planTitulo(dia,ses){
  if(ses&&ses.type==="gym")return null;
  var R=raceCfg(),d=(R&&R.plan&&R.plan[dia])||null;
  if(d&&!Array.isArray(d)&&typeof d==="object"&&d.t)return T(d.t)||null;
  return null;
}
/* La fecha real que le toca a cada posición de la semana en curso. */
/* Un día suelto puede llevar otra sesión que la de su plantilla: se adelantó,
   se cambió de sitio, se hizo otra cosa. La clave "ses:<fecha>" manda sobre el
   día de la semana, y solo para esa fecha. Sin esto la única forma de mover
   una sesión era retocar la semana entera, que la cambia para siempre. */
function diaDe(dia,base){
  var o=S("ses:"+dia,null);
  if(!o||!o.sid||!getSession(o.sid))return base;
  var c={};for(var k in base)c[k]=base[k];
  c.sid=o.sid;
  if("plus" in o)c.plus=o.plus||null;
  return c;
}
function fechaDeIdx(i){
  var d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+i);return iso(d);
}
function pasosHTML(t){
  if(!Array.isArray(t))return '<p style="font-size:15px;margin:2px 4px 0;line-height:1.4">'+esc(t)+"</p>";
  return t.map(function(paso){
    if(!Array.isArray(paso))return '<div class="sesr"><span class="sesd">'+esc(String(paso))+"</span></div>";
    return '<div class="sesr"><span class="sesl">'+esc(T(paso[0]))+'</span><span class="sesd">'+
           esc(T(paso[1]))+"</span></div>";
  }).join("");
}
function planCard(dia){
  var t=planDelDia(dia);
  if(!t)return "";
  var R=raceCfg(),meta=new Date(R.date+"T12:00:00"),ini=null;
  var ks=Object.keys(R.plan).sort();
  ini=ks.length?ks[0]:null;
  var sem=null;
  if(ini){
    var d1=new Date(ini+"T12:00:00"),d2=new Date(dia+"T12:00:00");
    sem=Math.floor((d2-d1)/(7*86400000))+1;
  }
  /* El plan puede venir como texto suelto o, mejor, como lista de pasos
     [etiqueta, contenido]. En ficha se lee de un vistazo con las zapatillas
     puestas; en párrafo hay que descifrarlo. */
  var cuerpo=pasosHTML(t);
  /* Se corre el día que se puede, no el que pone el calendario. Sin esto la
     sesión se quedaba en su fecha y el día real aparecía como descanso. */
  var mv=dia!==TODAY?'<button class="abtn ghost" data-act="planhoy" data-d="'+dia+
    '" style="margin:10px 4px 2px;width:auto;padding:6px 12px;font-size:12px">'+
    T(B("Lo hice hoy","Did it today"))+"</button>":"";
  return '<div class="card" style="border-left:3px solid var(--acc)"><div class="exhead">'+
    '<div class="tlab">🎯 '+(dia===TODAY?T(B("Hoy toca","Today")):T(B("Ese día","That day")))+
    (sem?' <span class="snum">'+T(B("semana","week"))+" "+sem+" "+T(B("de 15","of 15"))+"</span>":"")+
    "</div></div>"+cuerpo+mv+"</div>";
}
var MESC=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
/* Los días futuros no se pueden abrir desde Rutina: dayOff solo va hacia atrás,
   así que la ficha de una sesión solo se veía el día que tocaba. Para organizar
   la semana eso llega tarde: hace falta ver a qué se enfrenta uno. */
function proximasCard(){
  var W=getWeek(),hoy=new Date(),filas=[];
  for(var k=1;k<=7;k++){
    var d=new Date(hoy);d.setDate(d.getDate()+k);
    var ds=iso(d),w0=W[(d.getDay()+6)%7];
    if(!w0)continue;
    var w=diaDe(ds,w0);
    var s=getSession(w.sid);if(!s)continue;
    var pasos=planDelDia(ds),cuerpo="";
    if(pasos)cuerpo=pasosHTML(pasos);
    else if(s.items&&s.items.length){
      cuerpo='<div class="sesr"><span class="sesd">'+
        esc(s.items.map(function(it){return T(it.n)}).join(" · "))+"</span></div>";
    }
    /* El día de rodaje suave lleva además la sesión de fuerza (plus). Sin esto
       parecería un día ligero cuando son dos entrenos. */
    var ex=w.plus&&getSession(w.plus)?getSession(w.plus):null;
    if(ex&&ex.items&&ex.items.length){
      cuerpo+='<div class="sesr"><span class="sesl">'+esc(T(B("+ fuerza","+ strength")))+
        '</span><span class="sesd">'+esc(ex.items.map(function(it){return T(it.n)}).join(" · "))+"</span></div>";
    }
    filas.push('<div style="margin:14px 4px 0"><div class="tlab" style="color:var(--acc)">'+
      esc(T(w.d))+" "+d.getDate()+" "+MESC[d.getMonth()]+
      ' <span class="snum" style="color:var(--mut)">'+esc(planTitulo(ds,s)||T(s.title))+(ex?" + "+esc(T(ex.title)):"")+"</span></div></div>"+
      (cuerpo||'<div class="sesr"><span class="sesd" style="color:var(--mut)">'+T(B("Descanso","Rest"))+"</span></div>"));
  }
  if(!filas.length)return "";
  var ab=S("fold:proximas",null);if(ab===null||ab===undefined)ab=false;
  return '<div class="card"><button class="foldh" data-act="fold" data-k="proximas" aria-expanded="'+(ab?"true":"false")+'">'+
    "<h3>"+T(B("Lo que viene","What's coming"))+"</h3>"+
    '<span class="foldr"><span class="note" style="color:var(--mut);font-size:11px">'+
    T(B("7 días","7 days"))+'</span><span class="chev">'+(ab?"▾":"▸")+"</span></span></button>"+
    (ab?filas.join(""):"")+"</div>";
}
/* Tramos del reloj. El total de una sesión no distingue una de series de un
   rodaje del mismo tiempo: 3 km en 25 min sale igual seas quien seas. Los
   tramos son los que dicen si las series salieron al ritmo pedido. */
function lapsCard(act){
  var a=act;
  if(!a){
    var conL=(GACT.data||[]).filter(function(x){
      return /running/.test(x.type||"")&&x.raw&&x.raw.laps&&x.raw.laps.length>1;
    });
    if(!conL.length)return "";
    conL.sort(function(x,y){return x.start_time<y.start_time?1:-1});
    a=conL[0];
  }
  if(!a||!a.raw||!a.raw.laps||a.raw.laps.length<2)return "";
  var L=a.raw.laps;
  var pm=L.map(function(l){return (l.km>0)?l.min/l.km:null});
  var val=pm.filter(function(x){return x!=null&&isFinite(x)&&x>0});
  if(!val.length)return "";
  var ord=val.slice().sort(function(x,y){return x-y});
  var med=ord[Math.floor(ord.length/2)],rap=ord[0],len=ord[ord.length-1];
  /* El ritmo del mejor tramo se toma tal cual lo dio el reloj. Recalcularlo
     desde los km redondeados daba 3:26 en la leyenda y 3:29 en su fila. */
  var mejor="";
  L.forEach(function(l,k){if(pm[k]===rap&&!mejor)mejor=l.ritmo||""});
  /* Barra invertida: cuanto más rápido el tramo, más larga. Se estira entre el
     mejor y el peor del propio entreno, si no un rodaje parejo saldría plano. */
  function ancho(x){
    if(x==null||!isFinite(x))return 0;
    if(len<=rap)return 100;
    return Math.round(22+78*(len-x)/(len-rap));
  }
  var nf=0;
  var filas=L.map(function(l,k){
    var x=pm[k],fuerte=x!=null&&x<med*0.9;
    if(fuerte)nf++;
    return '<div class="lapr'+(fuerte?" hard":"")+'"><span class="lapn">'+l.i+"</span>"+
      '<div class="lapb"><i class="'+(fuerte?"on":"")+'" style="width:'+ancho(x)+'%"></i></div>'+
      '<span class="lapp">'+esc(l.ritmo||"—")+"</span>"+
      '<span class="lapm">'+(l.km>=1?l.km.toFixed(2)+" km":Math.round(l.km*1000)+" m")+"</span>"+
      '<span class="laphr">'+(l.fc?l.fc:"")+"</span></div>";
  }).join("");
  var f=a.start_time.slice(8,10)+"/"+a.start_time.slice(5,7);
  var leg='<div class="lapleg"><span>'+T(B("Mejor","Best"))+" <b>"+esc(mejor||fmtPace(rap))+"</b></span>"+
    (nf?"<span>"+T(B("Fuertes","Hard"))+" <b>"+nf+"</b></span>":"")+
    "<span>"+T(B("Tramos","Laps"))+" <b>"+L.length+"</b></span>"+
    '<span style="margin-left:auto">'+T(B("barra larga = más rápido","longer bar = faster"))+"</span></div>";
  return '<div class="card"><div class="exhead"><div class="tlab">\u23f1 '+
    T(B("Tramos del reloj","Watch laps"))+' <span class="snum">'+f+" \u00b7 "+
    (a.distance_km||0).toFixed(2)+" km</span></div></div>"+filas+leg+"</div>";
}
/* Reconciliación: lo que pedía la sesión contra lo que registró el reloj.
   "Completado" no distingue haber rodado a 7:05 de haberlo hecho a 8:00
   cuando el plan pedía 7:45-8:15, y esa diferencia es justo la que decide si
   el rodaje construye base o la gasta. */
/* fmtMin da "0:35:30", que es el formato de un tiempo de carrera. Para la
   duración de una sesión se lee mucho mejor "35 min" y "1 h 21 min". */
function fmtDur(m){
  m=Math.round(m||0);
  return m>=60?(Math.floor(m/60)+" h "+pad(m%60)+" min"):(m+" min");
}
function actsDe(dia){
  if(GACT.data===null){loadGact();return null}
  return (GACT.data||[]).filter(function(a){return (a.start_time||"").slice(0,10)===dia});
}
function rangoPlan(dia){
  var t=planDelDia(dia);
  if(!Array.isArray(t))return null;
  for(var i=0;i<t.length;i++){
    var txt=Array.isArray(t[i])?T(t[i][1]):String(t[i]);
    var m=/(\d+):(\d{2})\s*-\s*(\d+):(\d{2})/.exec(txt);
    if(m)return {rap:+m[1]*60+ +m[2], len:+m[3]*60+ +m[4], txt:m[0]};
  }
  return null;
}
function hechoCard(dia,ses){
  if(!cloudOn()||!ses)return "";
  var acts=actsDe(dia);
  if(acts===null)return "";
  var esRun=ses.type==="run";
  var mios=acts.filter(function(a){
    return esRun?/running/.test(a.type||""):(a.type||"")==="strength_training";
  });
  if(!mios.length)return "";
  var km=0,mins=0,fc=[],fcx=0,kcal=0;
  mios.forEach(function(a){
    km+=a.distance_km||0; mins+=a.duration_min||0; kcal+=a.calories||0;
    if(a.hr_avg)fc.push(a.hr_avg);
    if(a.hr_max&&a.hr_max>fcx)fcx=a.hr_max;
  });
  var fcm=fc.length?Math.round(fc.reduce(function(x,y){return x+y},0)/fc.length):null;
  var filas=[],veredicto="";
  if(esRun){
    var pm=km>0?mins/km:null;
    filas.push([B("Distancia","Distance"),km.toFixed(2)+" km"]);
    filas.push([B("Tiempo","Time"),fmtDur(mins)]);
    if(pm)filas.push([B("Ritmo","Pace"),fmtPace(pm)+"/km"]);
    if(fcm)filas.push([B("Pulso","HR"),fcm+(fcx?" / "+fcx:"")+" ppm"]);
    var R=rangoPlan(dia);
    if(R&&pm){
      var sg=Math.round(pm*60);
      if(sg<R.rap)veredicto=T(B("Más rápido de lo pedido ("+R.txt+"): ","Faster than asked ("+R.txt+"): "))+
        Math.round(R.rap-sg)+T(B(" s/km de más."," s/km too quick."));
      else if(sg>R.len)veredicto=T(B("Más lento de lo pedido ("+R.txt+"): ","Slower than asked ("+R.txt+"): "))+
        Math.round(sg-R.len)+T(B(" s/km."," s/km."));
      else veredicto=T(B("Dentro del rango pedido ("+R.txt+").","Within the asked range ("+R.txt+")."));
    }
  }else{
    filas.push([B("Tiempo","Time"),fmtDur(mins)]);
    if(fcm)filas.push([B("Pulso","HR"),fcm+(fcx?" / "+fcx:"")+" ppm"]);
    if(kcal)filas.push([B("Calorías","Calories"),kcal+" kcal"]);
    var hoyL=(LOGS.data||[]).filter(function(l){return l.day===dia&&(l.total_sets||0)>0});
    var series=hoyL.reduce(function(x,l){return x+(l.total_sets||0)},0);
    if(series)filas.push([B("Series registradas","Sets logged"),String(series)]);
    else veredicto=T(B("El reloj tiene el tiempo, pero las series no están registradas: eso solo lo sabe la app.",
                       "The watch has the time, but the sets aren't logged: only the app knows those."));
  }
  var cuerpo=filas.map(function(f){
    return '<div class="sesr"><span class="sesl">'+esc(T(f[0]))+'</span><span class="sesd">'+esc(f[1])+"</span></div>";
  }).join("");
  return '<div class="card" style="border-left:3px solid var(--ok)"><div class="exhead"><div class="tlab">📥 '+
    T(B("Lo que registró el reloj","What the watch recorded"))+"</div></div>"+cuerpo+
    (veredicto?'<p class="note" style="margin:8px 4px 0">'+esc(veredicto)+"</p>":"")+"</div>"+
    (esRun?lapsCard(mios.filter(function(a){return a.raw&&a.raw.laps})[0]):"");
}
function fcMax(){var r=raceCfg();return (r&&r.hr_max)||195}
/* Riegel parte de que la marca de referencia fue a tope. Proyectar desde un
   rodaje suave da un número malísimo y falso: a Sofi le puso 1:27:46 en rojo
   con una sesión que le había salido bien, y a Marcos 1:19 antes de saber que
   tenía un 50:36. Sin pulso no se puede saber si apretó, así que no cuenta. */
function duro(a){
  return a.hr_avg!=null&&a.hr_avg>=0.85*fcMax();
}

function runsOf(desde){
  var a=(GACT.data||[]).filter(function(x){
    return /running/.test(x.type||"") && (x.distance_km||0)>=1 && x.start_time;
  });
  if(desde)a=a.filter(function(x){return x.start_time.slice(0,10)>=desde});
  return a.sort(function(x,y){return x.start_time<y.start_time?-1:1});
}
function paceMin(a){
  if(!a.distance_km||!a.duration_min)return null;
  return a.duration_min/a.distance_km;
}
function fmtPace(m){
  if(m==null||!isFinite(m))return "—";
  var s=Math.round(m*60);return Math.floor(s/60)+":"+pad(s%60);
}
/* Ritmo corregido a 15 °C. Solo se corrige hacia arriba: por debajo de 15 el
   efecto es despreciable y corregir a la baja inventaría mejoras. */
function esCinta(a){return /treadmill|indoor/.test(a.type||"")}
function paceCorr(a){
  var pm=paceMin(a);if(pm==null)return null;
  var t=a.apparent_c!=null?+a.apparent_c:(a.temp_c!=null?+a.temp_c:null);
  if(t==null&&esCinta(a))t=TEMP_CINTA;
  if(t==null||t<=TEMP_REF)return pm;
  return pm-((t-TEMP_REF)*TEMP_SEG_GRADO)/60;
}
function lunesDe(ds){
  var d=new Date(ds+"T12:00:00"),wd=(d.getDay()+6)%7;
  d.setDate(d.getDate()-wd);return iso(d);
}
/* Agrupa por semana natural (lunes). */
function porSemana(runs){
  var m={};
  runs.forEach(function(a){
    var k=lunesDe(a.start_time.slice(0,10));
    (m[k]=m[k]||[]).push(a);
  });
  return m;
}
/* Predicción de tiempo con Riegel (exponente 1,06), el estándar para extrapolar
   entre distancias. Se alimenta del mejor esfuerzo reciente, no de un rodaje. */
function riegel(km1,min1,km2){return min1*Math.pow(km2/km1,1.06)}
function fmtMin(m){
  if(m==null||!isFinite(m))return "—";
  var s=Math.round(m*60);
  return Math.floor(s/3600)+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
}

function raceHeadCard(){
  var R=raceCfg();if(!R)return "";
  var hoy=new Date(),meta=new Date(R.date+"T12:00:00");
  var dias=Math.ceil((meta-hoy)/86400000);
  var runs=runsOf(),pred=null,base=null;
  /* Mejor esfuerzo de las últimas 6 semanas: el más rápido de al menos 3 km. */
  var lim=new Date();lim.setDate(lim.getDate()-42);
  runs.filter(function(a){return a.start_time.slice(0,10)>=iso(lim)&&(a.distance_km||0)>=3&&duro(a)})
      .forEach(function(a){
        var pm=paceCorr(a);
        if(pm!=null&&(base===null||pm<base.pm))base={pm:pm,km:a.distance_km,min:a.duration_min,a:a};
      });
  if(base)pred=riegel(base.km,base.min,R.km||10);
  var meta_min=R.goal_min||null;
  var ok=pred!=null&&meta_min!=null&&pred<=meta_min;
  var cols=[
    [B("Faltan","To go"),dias>0?dias+" "+T(B("días","days")):T(B("¡es hoy!","today!")),""],
    [B("Objetivo","Goal"),meta_min?fmtMin(meta_min):"—",""],
    [B("Previsto","Projected"),pred?fmtMin(pred):"—",pred==null?"":(ok?"ok":"bad")]
  ].map(function(c){
    return '<div class="macg"><div class="macl">'+esc(T(c[0]))+"</div><div class=\"bedv "+c[2]+'">'+esc(c[1])+"</div></div>";
  }).join("");
  var nota="";
  if(pred!=null&&base){
    var dif=Math.round((pred-(meta_min||pred)));
    nota=T(B("Proyección desde tu mejor esfuerzo reciente: ","Projected from your best recent effort: "))+
         base.km.toFixed(2)+" km a "+fmtPace(base.pm)+" ("+base.a.start_time.slice(8,10)+"/"+base.a.start_time.slice(5,7)+")."+
         (meta_min?(" "+(ok?T(B("Vas por delante del objetivo.","You're ahead of goal.")):
           T(B("Te faltan ","You're "))+Math.abs(dif)+T(B(" min para el objetivo."," min off goal.")))):"");
  }else nota=T(B("Aún no hay un esfuerzo fuerte con el que proyectar. Un rodaje suave no sirve: Riegel supone que fuiste a tope, así que saldría una cifra mala y falsa. El test de 5 km dará la primera de verdad.",
                 "No hard effort to project from yet. An easy run won't do: Riegel assumes you went all out, so it would give a bad and false number. The 5 km test will give the first real one."));
  /* La marca personal, sacada del propio histórico: da la escala de si el
     objetivo es una vuelta o un salto. Sin esto, un objetivo de 55 min parece
     una temeridad cuando en realidad ya se ha corrido 50:36. */
  var mejor=null;
  runsOf().forEach(function(a){
    var d=a.distance_km||0;
    if(d>=(R.km||10)*0.96&&d<=(R.km||10)*1.07&&a.duration_min&&
       (mejor===null||a.duration_min<mejor.duration_min))mejor=a;
  });
  if(mejor)nota+=" "+T(B("Tu mejor ","Your best "))+(R.km||10)+"K: "+fmtMin(mejor.duration_min)+
    " ("+mejor.start_time.slice(0,4)+").";
  return '<div class="card"><div class="exhead"><div class="tlab">🏁 '+esc(T(R.name||"Carrera"))+
    ' <span class="snum">'+esc(R.date)+" · "+(R.km||10)+" km</span></div></div>"+
    '<div class="macrow">'+cols+'</div><div class="macwarn" style="color:var(--mut);border-top-color:var(--line)">'+esc(nota)+"</div></div>";
}

function volumeCard(){
  var R=raceCfg();
  var desde=new Date();desde.setDate(desde.getDate()-77);      /* 11 semanas */
  var runs=runsOf(iso(desde));
  if(!runs.length)return "";
  var sem=porSemana(runs),ks=Object.keys(sem).sort();
  var pares=ks.map(function(k){
    var km=sem[k].reduce(function(a,b){return a+(b.distance_km||0)},0);
    return [k.slice(8,10)+"/"+k.slice(5,7),Math.round(km*10)/10];
  });
  var tot=pares.reduce(function(a,b){return a+b[1]},0);
  var ult=pares.length?pares[pares.length-1][1]:0;
  var prev=pares.length>1?pares[pares.length-2][1]:0;
  var salto=prev>0?Math.round((ult/prev-1)*100):0;
  /* La regla del 10 %: subir el volumen semanal más de eso es el factor de
     riesgo de lesión mejor documentado en corredores populares. */
  /* Por debajo de 12 km/semana el porcentaje es ruido: pasar de 4 a 4,9 km es
     un +23 % que no significa nada, y avisar cada semana de la reconstrucción
     entrena a ignorar el aviso justo antes de que importe. */
  var av=(prev>=12&&salto>15)?
    '<div class="macwarn">'+esc(T(B("Has subido el volumen un ","Volume up "))+salto+
      T(B(" % respecto a la semana pasada. Por encima del 10-15 % sube el riesgo de lesión."," % on last week. Above 10-15 % injury risk rises.")))+"</div>":"";
  var kmC=runs.filter(esCinta).reduce(function(a,b){return a+(b.distance_km||0)},0);
  var repar=kmC>0?" · "+Math.round(kmC)+" "+T(B("en cinta","on treadmill")):"";
  return '<div class="card"><div class="exhead"><div class="tlab">📏 '+
    T(B("Kilómetros por semana","Weekly volume"))+' <span class="snum">'+Math.round(tot)+" km "+
    T(B("en 11 semanas","over 11 weeks"))+esc(repar)+"</span></div></div>"+
    barChart(pares,{uid:"vol",col:"#F0A63C",fmt:function(v){return v}})+av+"</div>";
}

function efficiencyCard(){
  var desde=new Date();desde.setDate(desde.getDate()-84);
  var runs=runsOf(iso(desde)).filter(function(a){
    return a.hr_avg&&a.hr_avg<=fcMax()*PCT_SUAVE&&(a.distance_km||0)>=2;
  });
  if(runs.length<3)
    return '<div class="card"><div class="exhead"><div class="tlab">📈 '+T(B("Eficiencia aeróbica","Aerobic efficiency"))+
      '</div></div><p class="note">'+esc(T(B("Hacen falta al menos 3 rodajes suaves (por debajo del 82 % de tu máxima) para empezar a ver la tendencia.",
      "At least 3 easy runs (below 82 % of max HR) are needed before a trend shows.")))+"</p></div>";
  var sem=porSemana(runs),ks=Object.keys(sem).sort();
  /* Índice: segundos de ritmo corregido por pulsación. Baja = mejor. Se muestra
     como ritmo a 150 ppm, que se entiende mucho mejor que el índice crudo. */
  var pares=ks.map(function(k){
    var ss=0,n=0;
    sem[k].forEach(function(a){
      var pm=paceCorr(a);
      if(pm!=null&&a.hr_avg)  {ss+=pm/a.hr_avg;n++;}
    });
    return n?[k.slice(8,10)+"/"+k.slice(5,7),Math.round(ss/n*150*60)]:null;
  }).filter(Boolean);
  if(pares.length<2)return "";
  var pri=pares[0][1],ult=pares[pares.length-1][1];
  var mejora=pri-ult;                                  /* segundos ganados */
  var msg=Math.abs(mejora)<4
    ? T(B("Estable. Todavía no hay tendencia clara.","Flat. No clear trend yet."))
    : (mejora>0
        ? T(B("Has ganado ","You've gained "))+mejora+T(B(" s/km a igual pulso desde ","s/km at the same HR since "))+pares[0][0]+"."
        : T(B("Has perdido ","You've lost "))+Math.abs(mejora)+T(B(" s/km a igual pulso. Con calor o fatiga es esperable."," s/km at the same HR. Heat or fatigue will do that.")));
  return '<div class="card"><div class="exhead"><div class="tlab">📈 '+
    T(B("Eficiencia aeróbica","Aerobic efficiency"))+' <span class="snum">'+
    T(B("menos es mejor","lower is better"))+"</span></div></div>"+
    '<p class="note" style="margin:0 0 2px 4px">'+
    esc(T(B("Tu ritmo a 150 ppm, corregido a 15 °C: con calor el pulso sube y el ritmo se cae sin que hayas empeorado.",
            "Your pace at 150 bpm, corrected to 15 °C: heat raises HR and slows pace without you getting worse.")))+"</p>"+
    areaChart(pares,{uid:"ef",col:mejora>=4?"#46C08A":(mejora<=-4?"#E8963E":"#7BA1D9"),
      fmt:function(v){return Math.floor(v/60)+":"+pad(v%60)}})+
    '<div class="macwarn" style="color:'+(mejora>=4?"var(--ok)":"var(--mut)")+';border-top-color:var(--line)">'+esc(msg)+
    "</div></div>";
}

function intensityCard(){
  var desde=new Date();desde.setDate(desde.getDate()-56);
  var runs=runsOf(iso(desde)).filter(function(a){return a.hr_avg});
  if(runs.length<3)return "";
  var M=fcMax(),min={s:0,m:0,d:0};
  runs.forEach(function(a){
    var p=a.hr_avg/M,t=a.duration_min||0;
    if(p<=PCT_SUAVE)min.s+=t;else if(p<=0.89)min.m+=t;else min.d+=t;
  });
  var tot=min.s+min.m+min.d;
  if(!tot)return "";
  var pctS=Math.round(min.s/tot*100);

  /* Anillo en vez de barras apiladas: el mensaje de esta tarjeta es UN número
     —qué porcentaje del tiempo va suave— y un anillo lo dice de un vistazo.
     La marca del 80 % es el objetivo: por debajo del 65 % se vive en la zona
     gris, demasiado duro para acumular volumen y demasiado suave para ganar
     velocidad. */
  var R=42,C=2*Math.PI*R,cx=60,cy=60,off=0;
  var segs=[[min.s,"#46C08A"],[min.m,"#E8963E"],[min.d,"#E5484D"]];
  var anillo='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#222A35" stroke-width="15"/>';
  segs.forEach(function(sg){
    if(sg[0]<=0)return;
    var len=sg[0]/tot*C;
    anillo+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+sg[1]+
      '" stroke-width="15" stroke-dasharray="'+len.toFixed(1)+" "+(C-len).toFixed(1)+
      '" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 '+cx+" "+cy+')"/>';
    off+=len;
  });
  /* marca del objetivo, al 80 % */
  var ang=(0.80*360-90)*Math.PI/180;
  anillo+='<line x1="'+(cx+Math.cos(ang)*(R-9)).toFixed(1)+'" y1="'+(cy+Math.sin(ang)*(R-9)).toFixed(1)+
    '" x2="'+(cx+Math.cos(ang)*(R+9)).toFixed(1)+'" y2="'+(cy+Math.sin(ang)*(R+9)).toFixed(1)+
    '" stroke="#EDF0F4" stroke-width="2" opacity=".85"><title>'+T(B("objetivo 80 %","80 % target"))+"</title></line>";
  var col=pctS>=75?"#46C08A":(pctS>=65?"#E8963E":"#E5484D");
  /* El hueco interior mide 69 px de ancho (radio 42 menos medio grosor de 15),
     así que "100%" a 26 se salía por los lados. Se encoge cuando hay tres
     cifras, que es justo el caso en el que más ancho ocupa. */
  var fz=pctS>=100?19:23;
  anillo+='<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" fill="'+col+
    '" font-size="'+fz+'" font-weight="700" font-family="ui-monospace,monospace">'+pctS+"%</text>"+
    '<text x="'+cx+'" y="'+(cy+17)+'" text-anchor="middle" fill="#8E99A8" font-size="9.5" font-family="ui-monospace,monospace">'+
    T(B("suave","easy"))+"</text>";

  function fila(et,mm,c){
    if(mm<=0)return "";
    return '<div class="intr"><i style="background:'+c+'"></i><span class="intn">'+T(et)+
      '</span><span class="intv">'+Math.round(mm)+"′</span><span class=\"intp\">"+
      Math.round(mm/tot*100)+"%</span></div>";
  }
  var det=fila(B("Suave","Easy"),min.s,"#46C08A")+fila(B("Medio","Moderate"),min.m,"#E8963E")+
          fila(B("Duro","Hard"),min.d,"#E5484D");
  var av=pctS<65
    ? '<div class="macwarn">'+esc(T(B("Estás en la zona gris: demasiado duro para acumular volumen y demasiado suave para ganar velocidad. Separa los días.",
        "You're in the grey zone: too hard to build volume, too easy to build speed. Separate the days.")))+"</div>"
    : (pctS>96&&min.d<=0
      ? '<div class="macwarn" style="color:var(--mut);border-top-color:var(--line)">'+
        esc(T(B("Todo suave. Bien para volver, pero sin un día rápido a la semana no se gana velocidad.",
                "All easy. Fine for coming back, but without one fast day a week you don't gain speed.")))+"</div>"
      : "");
  return '<div class="card"><div class="exhead"><div class="tlab">🎚 '+
    T(B("Cómo repartes el esfuerzo","How you split effort"))+' <span class="snum">'+
    T(B("8 semanas","8 weeks"))+"</span></div></div>"+
    '<div class="intwrap"><svg viewBox="0 0 120 120" width="120" height="120">'+anillo+"</svg>"+
    '<div class="intlist">'+det+"</div></div>"+av+"</div>";
}

/* Marcas personales y volumen por año, del histórico completo. Con 769 carreras
   desde 2016 importadas de Strava, una lista de las 10 últimas no sirve de nada:
   lo que se quiere ver es qué has hecho y cómo has evolucionado. */
function marcasCard(){
  var runs=runsOf();
  if(runs.length<10)return "";
  var DIST=[[5,"5K",0.96,1.06],[10,"10K",0.96,1.07],[21.097,B("Media","Half"),0.975,1.04]];
  var filas=DIST.map(function(D){
    var mejor=null;
    runs.forEach(function(a){
      var km=a.distance_km||0;
      if(km<D[0]*D[2]||km>D[0]*D[3]||!a.duration_min)return;
      if(mejor===null||a.duration_min<mejor.duration_min)mejor=a;
    });
    if(!mejor)return "";
    var rit=paceMin(mejor);
    return '<div class="pbr"><span class="pbd">'+esc(T(D[1]))+'</span>'+
      '<span class="pbt">'+fmtMin(mejor.duration_min)+"</span>"+
      '<span class="pbp">'+fmtPace(rit)+"/km</span>"+
      '<span class="pby">'+mejor.start_time.slice(0,4)+"</span></div>";
  }).join("");
  if(!filas)return "";
  /* volumen y eficiencia por año: la foto de una década en cinco filas */
  var porAno={};
  runs.forEach(function(a){
    var y=a.start_time.slice(0,4);
    var o=porAno[y]=porAno[y]||{n:0,km:0,ef:[]};
    o.n++;o.km+=a.distance_km||0;
    var pm=paceCorr(a);
    if(pm!=null&&a.hr_avg&&a.hr_avg>120&&a.hr_avg<175)o.ef.push(pm/a.hr_avg*150);
  });
  var anos=Object.keys(porAno).sort().slice(-6);
  var filasA=anos.map(function(y){
    var o=porAno[y];
    o.ef.sort(function(a,b){return a-b});
    var med=o.ef.length?o.ef[Math.floor(o.ef.length/2)]:null;
    return '<div class="pbr"><span class="pbd">'+y+'</span>'+
      '<span class="pbt" style="font-size:13px">'+Math.round(o.km)+" km</span>"+
      '<span class="pbp">'+o.n+" "+T(B("carreras","runs"))+"</span>"+
      '<span class="pby">'+(med?fmtPace(med):"—")+"</span></div>";
  }).join("");
  return '<div class="card"><div class="exhead"><div class="tlab">🏅 '+
    T(B("Tus marcas","Your bests"))+' <span class="snum">'+runs.length+" "+
    T(B("carreras desde","runs since"))+" "+runs[0].start_time.slice(0,4)+"</span></div></div>"+
    filas+
    '<div class="exhead" style="margin-top:12px"><div class="tlab">📅 '+
    T(B("Por año","By year"))+' <span class="snum">'+T(B("última columna: ritmo a 150 ppm","last column: pace at 150 bpm"))+"</span></div></div>"+
    filasA+"</div>";
}

/* El racional del plan entero: por qué esta estructura y qué hace cada día.
   Vive aquí, plegable y con la memoria del pliegue, en vez de dentro de cada
   sesión: con las zapatillas puestas se quiere lo del día, no la teoría. */
function racionalCard(){
  var t=T(B(
"**Los tres días hacen cosas distintas, y esa es toda la idea.**\n\n"+
"**Martes · calidad.** Sube el VO₂max, mejora la economía de carrera y enseña al músculo a tamponar lactato. Es el ÚNICO día que se corre por encima del umbral, y por eso los otros dos van suaves de verdad: si los tres van a medio gas no se estimula ninguna de las dos vías. Es el error más repetido del corredor popular.\n\n"+
"**Jueves · suave y corto.** Construye lo que sostiene un 10K: densidad mitocondrial, capilarización, volumen sistólico y oxidación de grasas. Todo eso depende del TIEMPO acumulado a intensidad baja, no del esfuerzo. Las rectas del final son adaptación neuromuscular sin coste metabólico: mejoran la técnica sin añadir fatiga.\n\n"+
"**Domingo · tirada progresiva.** Empieza suave y termina rápida. Correr rápido con las piernas ya cansadas es específico de competir: es lo que pasa en el kilómetro 8. Y cae justo después del día de carga a propósito.\n\n"+
"**Los tres bloques.** Semanas 1-4: volver, con series de un minuto. Semanas 5-9: construir, con umbral y cuestas, y el test de 5 km del 4 de octubre que recalibra todos los ritmos. Semanas 10-15: ritmo de carrera, con la sesión clave el 3 de noviembre — cuatro bloques de cinco minutos a ritmo objetivo. Si esa sale bien, la marca está.\n\n"+
"**Y el peso.** Agosto con déficit, que el volumen aún es bajo. Desde septiembre, cuando la tirada pase de 60-65 minutos, a mantenimiento: con más volumen y déficit el entrenamiento produce fatiga en vez de adaptación.",
"**The three days do different things, and that's the whole idea.**\n\n"+
"**Tuesday · quality.** Raises VO₂max, improves running economy and teaches the muscle to buffer lactate. It's the ONLY day above threshold, which is why the other two are genuinely easy.\n\n"+
"**Thursday · easy and short.** Builds mitochondrial density, capillarisation, stroke volume and fat oxidation — all dependent on accumulated TIME at low intensity. The strides are neuromuscular adaptation with no metabolic cost.\n\n"+
"**Sunday · progressive long run.** Starts easy, finishes fast. Running fast on tired legs is specific to racing: it's what happens at km 8. And it falls right after the load day on purpose.\n\n"+
"**The three blocks.** Weeks 1-4: come back. Weeks 5-9: build, with the 5 km test on 4 October recalibrating every pace. Weeks 10-15: race pace, with the key session on 3 November.\n\n"+
"**And weight.** Deficit through August; from September, maintenance."));
  return foldCard("racional","🧭 "+T(B("Cómo funciona el plan","How the plan works")),"",t,false);
}

}
function fmtK(n){return n>=10000?(n/1000).toFixed(1).replace(".0","")+"k":String(Math.round(n))}
function colChart(pairs,fmt){
  var max=1;pairs.forEach(function(p){if(p[1]>max)max=p[1]});
  return '<div class="cols">'+pairs.map(function(p){
    var hpx=Math.round(p[1]/max*76);

/* selector de rango compartido 7/30/90 */
function rangeSel(cur,act){
  return '<span class="rng">'+[7,30,90].map(function(r){

/* barras apiladas de dos segmentos (a abajo, b arriba) */
function stack2(pairs,colA,colB,fmt){
  var max=1;pairs.forEach(function(p){if(p.a+p.b>max)max=p.a+p.b});
  return '<div class="cols">'+pairs.map(function(p){
    var tot=p.a+p.b,hT=Math.round(tot/max*76);
    var hA=tot?Math.round(hT*p.a/tot):0,hB=hT-hA;
    return '<div class="c"><span style="font-size:10px;color:var(--mut);font-family:var(--mono)">'+(tot?(fmt?fmt(tot):tot):"")+'</span>'+
      '<div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end">'+
      '<div style="height:'+hB+'px;background:'+colB+';border-radius:4px 4px 0 0"></div>'+
      '<div style="height:'+hA+'px;background:'+colA+(hB?"":";border-radius:4px 4px 0 0")+'"></div></div>'+
      '<span class="cl">'+p.lbl+"</span></div>"}).join("")+"</div>";
}
var UPPERSET={chest:1,back:1,shoulders:1,biceps:1,triceps:1,cuff:1};
function isCardioLog(l){
  var es=l.entries||[];
  return (l.session_id||"").indexOf("garmin-")===0||(es.length>0&&es.every(function(e){return e.m==="cardio"}));
}
function entryVol(e){
  var w=+e.weight||0;if(!w)return 0;
  var reps=0;
  if(e.reps){
    var ns=String(e.reps).split(/[^\d.]+/).filter(Boolean).map(Number).filter(function(n){return n>0});
    if(ns.length===1)reps=ns[0]*(+e.sets||1);
    else if(ns.length>1)reps=ns.reduce(function(a,b){return a+b},0);
  }
  if(!reps&&e.target){
    var mm=/×(.+)$/.exec(e.target);
    reps=repsMid(mm?mm[1]:e.target)*(+e.sets||1);
  }
  return w*reps;
}

function statsView(){

  var exs={};
  logs.forEach(function(l){
    var m=mondayOf(l.day),cardio=isCardioLog(l);
    if(wk[m]){
      if(cardio)wk[m].c++;else wk[m].f++;
      if(!cardio)(l.entries||[]).forEach(function(e){
        var v=entryVol(e);if(!v)return;
        if(e.m==="legs")wk[m].lo+=v;else if(UPPERSET[e.m])wk[m].up+=v;
      });
    }
    (l.entries||[]).forEach(function(e){
      if(e.weight>0){
        var x=exs[e.n]||(exs[e.n]={first:e.weight,last:e.weight,max:e.weight,n:0});
        x.last=e.weight;if(e.weight>x.max)x.max=e.weight;x.n++;
      }
    });
  });
  var lbl=function(m){var d=new Date(m+"T12:00:00");return pad(d.getDate())+"/"+pad(d.getMonth()+1)};
  h+='<div class="card"><h3>'+u("statsSessions")+"</h3>"+
     stack2(weeks.map(function(m){return{lbl:lbl(m),a:wk[m].f,b:wk[m].c}}),"#F0A63C","#7BA1D9")+
     '<div class="chips" style="margin-top:8px"><span class="chip" style="color:#F0A63C">■ '+u("legF2")+'</span><span class="chip" style="color:#7BA1D9">■ '+u("legCar")+"</span></div></div>";
  h+='<div class="card"><h3>'+u("statsVolume")+" ("+u("kgLbl")+')</h3>'+
     stack2(weeks.map(function(m){return{lbl:lbl(m),a:Math.round(wk[m].up),b:Math.round(wk[m].lo)}}),"#F0A63C","#46C08A",fmtK)+
     '<div class="chips" style="margin-top:8px"><span class="chip" style="color:#F0A63C">■ '+u("legUp")+'</span><span class="chip" style="color:#46C08A">■ '+u("legLo")+"</span></div></div>";
  var ekeys=Object.keys(exs).sort(function(a,b){return exs[b].n-exs[a].n}).slice(0,10);
  if(ekeys.length){
    h+='<div class="card"><h3>'+u("statsExercises")+"</h3><div style='margin-top:6px'>"+ekeys.map(function(k){
      var x=exs[k];var up=x.last>x.first;
      return '<div class="exrow"><span class="xn">'+esc(k)+'</span><span class="xv'+(up?" up":"")+'">'+x.last+" / "+x.max+" "+u("kgLbl")+(up?" ↑":"")+"</span></div>"}).join("")+"</div></div>";
  }
  h+='<p class="note" style="margin:12px 4px;color:var(--mut)">'+logs.length+" "+u("totalLbl")+"</p>";
  return h;
}

/* Series por grupo muscular — caja final con su propio rango */
/* Series acumuladas por grupo muscular en los últimos `rng` días. */
function muscleSets(rng){
  var logs=LOGS.data||[],out={};
  var cut=new Date();cut.setDate(cut.getDate()-rng);var cutS=iso(cut);
  logs.forEach(function(l){
    if(l.day<cutS)return;
    (l.entries||[]).forEach(function(e){if(e.m)out[e.m]=(out[e.m]||0)+(e.sets||0)});
  });
  return out;
}

var HEAT=[[0,[34,42,53]],[.35,[61,70,87]],[.7,[122,90,37]],[1,[240,166,60]]];
function heatColor(t){
  if(!(t>0))return "rgb(34,42,53)";
  if(t>1)t=1;
  for(var i=1;i<HEAT.length;i++){
    if(t<=HEAT[i][0]){
      var a=HEAT[i-1],b=HEAT[i],f=(t-a[0])/((b[0]-a[0])||1);
      return "rgb("+[0,1,2].map(function(c){return Math.round(a[1][c]+(b[1][c]-a[1][c])*f)}).join(",")+")";
    }
  }
  return "rgb(240,166,60)";
}
var BODYKEYS=["chest","back","shoulders","biceps","triceps","legs","core","cuff"];
function bodyFig(mus,mmax){
  var col={};
  BODYKEYS.forEach(function(k){col[k]=heatColor(mmax?((mus[k]||0)/mmax):0)});
  return BODYSVG
    .replace(/data-m='([a-z]+)'/g,function(_,g){
      return "data-m='"+g+"' fill='"+(col[g]||"#222A35")+"' stroke='#10141b' stroke-width='.7'";})
    /* Los <use> son espejos de la otra mitad: si les fijamos relleno tapan el
       del original y el cuerpo sale medio pintado. Se dejan heredar. */
    .replace(/data-x='1'/g,"fill='#1b2029' stroke='#2b3442' stroke-width='.45'");
}
function bodyMapView(){
  if(LOGS.data===null){loadLogs();return '<div class="card"><p class="note">'+u("loading")+"</p></div>"}
  if(!LOGS.data.length)return '<div class="card"><p class="note">'+u("noLogs")+"</p></div>";
  var rng=state.musRange||30;
  var mus=muscleSets(rng);
  var enCuerpo=["chest","back","shoulders","biceps","triceps","legs","core","cuff"];
  var mmax=0;enCuerpo.forEach(function(k){if((mus[k]||0)>mmax)mmax=mus[k]});
  if(!mmax)return '<div class="card"><p class="note">'+T(B("Sin series registradas en este periodo.","No sets logged in this period."))+"</p>"+rangeSel(rng,"musrange")+"</div>";
  var chips=enCuerpo.concat(["cardio"]).filter(function(k){return mus[k]}).sort(function(a,b){return mus[b]-mus[a]})
    .map(function(k){
      return '<span class="bchip"><i style="background:'+(k==="cardio"?"#4DD0C0":heatColor(mus[k]/mmax))+'"></i>'+
        esc(T(MUSC[k]||{es:k,en:k}))+" <b>"+mus[k]+"</b></span>";
    }).join("");
  var sinTocar=enCuerpo.filter(function(k){return !mus[k]})
    .map(function(k){return esc(T(MUSC[k]||{es:k,en:k}))});
  var grad="linear-gradient(90deg,"+HEAT.map(function(s){
    return "rgb("+s[1].join(",")+") "+Math.round(s[0]*100)+"%"}).join(",")+")";
  /* El manguito no aparece en la figura: en un mapa anatómico general no se
     distingue del deltoides. Sigue contando en los chips. */
  return '<div class="card"><div class="exhead"><h3>'+T(B("Mapa de carga","Load map"))+'</h3>'+rangeSel(rng,"musrange")+"</div>"+
    '<div class="bmap">'+bodyFig(mus,mmax)+"</div>"+
    '<div class="bcap"><span>'+T(B("Frente","Front"))+"</span><span>"+T(B("Espalda","Back"))+"</span></div>"+
    '<div class="bleg"><span>'+T(B("menos","less"))+'</span><i style="background:'+grad+'"></i><span>'+T(B("más","more"))+" ("+mmax+")</span></div>"+
    '<div class="bchips">'+chips+"</div>"+
    (sinTocar.length?'<p class="note" style="font-size:12.5px;color:var(--mut);margin-top:10px">'+
      T(B("Sin trabajar estos días: ","Untouched in this period: "))+sinTocar.join(" · ")+"</p>":"")+
    '<p class="battr">'+T(B("Figura: ","Figure: "))+
      '<a href="https://commons.wikimedia.org/wiki/File:Muscles_front_and_back.svg" target="_blank" rel="noopener">Muscles front and back</a>'+
      ' — OpenStax, Tomáš Kebert &amp; umimeto.org · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>'+
      T(B(" · adaptada (color por carga)"," · adapted (coloured by load)"))+"</p>"+
    "</div>";
}

function muscleView(){
  var logs=LOGS.data||[];if(!logs.length)return "";
  var rng=state.musRange||30;
  var mus=muscleSets(rng);
  var mk=Object.keys(mus).sort(function(a,b){return mus[b]-mus[a]});
  if(!mk.length)return "";
  var mmax=mus[mk[0]]||1;
  return '<div class="card"><div class="exhead"><h3>'+u("statsMuscle")+"</h3>"+rangeSel(rng,"musrange")+'</div><div style="margin-top:8px">'+
    mk.map(function(k){
      return '<div class="bar"><span class="bl">'+esc(T(MUSC[k]||{es:k,en:k}))+'</span><span class="bt"><span class="bf" style="width:'+Math.round(mus[k]/mmax*100)+'%"></span></span><span class="bv">'+mus[k]+"</span></div>"}).join("")+"</div></div>";
}

/* ---------- analíticas (kv "labs", subida desde el backend con labs_push.py) ----------
   Sub-vista de Progreso, solo visible para cuentas con la clave. Los rangos son
   orientativos del laboratorio: el color naranja marca "fuera de rango", la
   interpretación (medicación, tendencia) viaja en las alertas del propio dato. */
function labsView(L){
  function lfd(iso){return iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(2,4):""}
  function lfm(iso){return iso?iso.slice(5,7)+"/"+iso.slice(2,4):""}
  function fN(x){var s=String(x);return LANG==="es"?s.replace(".",","):s}
  function fRef(ref){
    if(!ref)return "—";
    var lo=ref[0],hi=ref[1];
    if(lo==null)return "&lt;"+fN(hi);
    if(hi==null)return "&gt;"+fN(lo);
    return fN(lo)+"–"+fN(hi);
  }
  var last=L.dates[L.dates.length-1],LBN=0;
  var h='<div class="card"><h3>🧪 '+u("labsT")+'</h3>'+
    '<p class="note"><b>'+lfd(last)+"</b>"+
    (L.next?' · <span style="color:var(--mut)">'+T(B("próxima","next"))+" ≈ "+lfd(L.next)+"</span>":"")+"</p>";
  if(L.ask&&L.ask.length)
    h+='<p class="note" style="margin-top:8px">📋 <b>'+T(B("Pide:","Ask for:"))+"</b> "+
       L.ask.map(function(a){return esc(T(a))}).join(" · ")+"</p>";
  h+="</div>";
  /* Antes de la próxima extracción: confusores que el laboratorio no conoce
     (enfermedad reciente, suplementos, medicación). ✅ = ya resuelto. */
  if(L.pre&&L.pre.length&&L.next){
    h+='<div class="card"><h3>🧾 '+T(B("Antes de la extracción","Before the draw"))+"</h3>"+
       L.pre.map(function(a,i){
         return '<button class="lrow" data-act="xtoggle" data-x="lpre'+i+'"><span>'+(a.i||"•")+"</span>"+
           '<span class="lt"'+(a.ok?' style="color:var(--mut)"':"")+">"+esc(T(a.t))+'</span><span class="lchev">›</span></button>'+
           '<div class="how" id="lpre'+i+'">'+esc(T(a.d))+"</div>";
       }).join("")+"</div>";
  }
  /* Alertas: titular corto siempre visible, el contexto (medicación, tendencia)
     se despliega al tocar — así la tarjeta no es un muro de texto. */
  if(L.alerts&&L.alerts.length){
    h+='<div class="card"><h3>⚠️ '+T(B("A vigilar","Watch list"))+"</h3>"+
       L.alerts.map(function(a,i){
         return '<button class="lrow" data-act="xtoggle" data-x="lal'+i+'"><span>'+(a.i||"•")+"</span>"+
           '<span class="lt">'+esc(T(a.t))+'</span><span class="lchev">›</span></button>'+
           '<div class="how" id="lal'+i+'">'+esc(T(a.d))+"</div>";
       }).join("")+"</div>";
  }
  (L.cats||[]).forEach(function(cat){
    var trs=(cat.params||[]).map(function(p){
      var dsv=Object.keys(p.v).sort(),lastD=dsv[dsv.length-1],v=p.v[lastD];
      var out=p.ref&&((p.ref[0]!=null&&v<p.ref[0])||(p.ref[1]!=null&&v>p.ref[1]));
      var col=out?"var(--warn)":"var(--text)";
      var vh='<b style="color:'+col+'">'+fN(v)+"</b>"+
             (p.u?'<span style="font-size:10px;color:var(--mut)"> '+p.u+"</span>":"");
      var pd=dsv[dsv.length-2],sub;
      if(pd!=null){
        var pv=p.v[pd],ar=v>pv?"↑":(v<pv?"↓":"→");
        sub=ar+" "+fN(pv)+" · "+lfm(pd);
      }else sub=lfd(lastD);
      /* Con 3+ analíticas la fila se despliega con la serie completa: la tabla
         se mantiene estrecha sin perder el histórico. */
      var more=dsv.length>2,id="lp"+(LBN++),det="";
      if(more){
        det='<tr><td colspan="3" style="padding:0;border-top:none"><div class="how" id="'+id+'">'+
            dsv.slice().reverse().map(function(d){
              var dv=p.v[d],o=p.ref&&((p.ref[0]!=null&&dv<p.ref[0])||(p.ref[1]!=null&&dv>p.ref[1]));
              return '<span style="white-space:nowrap">'+lfd(d)+" <b"+(o?' style="color:var(--warn)"':"")+">"+fN(dv)+"</b></span>";
            }).join(" · ")+(p.u?' <span style="color:var(--mut)">'+p.u+"</span>":"")+"</div></td></tr>";
      }
      return "<tr"+(more?' data-act="xtoggle" data-x="'+id+'"':"")+"><td>"+esc(p.n)+"</td><td>"+vh+
             '<div style="font-size:10px;color:var(--mut);font-weight:400">'+sub+
             (more?' <span style="font-size:12px">›</span>':"")+"</div></td>"+
             '<td style="font-size:12px;color:var(--mut)">'+fRef(p.ref)+"</td></tr>"+det;
    }).join("");
    h+='<div class="card"><h3>'+(cat.i?cat.i+" ":"")+esc(T(cat.t))+'</h3><table class="mini labs">'+trs+"</table></div>";
  });
  /* Cómo vivías los 90 días antes de cada extracción. Es DESCRIPTIVO: con una o dos
     analíticas solapadas no hay base para correlacionar nada, y la nota lo dice. */
  if(L.ctx&&L.ctx.length&&L.win){
    var trs2=L.ctx.slice().reverse().map(function(c){
      var cel=L.win.filter(function(w){return c.m[w.f]!=null}).map(function(w){
        return '<span style="white-space:nowrap">'+esc(T(w.t))+" <b>"+
          (LANG==="es"?String(c.m[w.f]).replace(".",","):c.m[w.f])+"</b>"+
          (w.u?'<span style="font-size:10px;color:var(--mut)">'+w.u+"</span>":"")+"</span>";
      }).join(" · ");
      return "<tr><td>"+lfd(c.d)+"</td><td style='font-size:13px'>"+cel+
        '<div style="font-size:10px;color:var(--mut);margin-top:3px">'+c.n+" "+T(B("días con datos","days of data"))+
        (c.trav?" · "+c.trav+" "+T(B("de viaje","travelling")):"")+"</div></td></tr>";
    }).join("");
    h+='<div class="card"><h3>📅 '+T(B("Los 90 días antes de cada analítica","The 90 days before each panel"))+
       '</h3><table class="mini labs">'+trs2+"</table>"+
       '<p class="note" style="font-size:11px;margin-top:8px">'+
       T(B("Descriptivo, no predictivo: solo hay datos diarios desde abril de 2026, así que de momento esto sirve para poner cada analítica en su contexto, no para sacar correlaciones.",
           "Descriptive, not predictive: daily data only goes back to April 2026, so for now this puts each panel in context rather than yielding correlations."))+"</p></div>";
  }
  h+='<div class="card"><p class="note" style="font-size:12px">'+
     T(B("Toca cualquier fila con › para ver la serie completa. Rangos orientativos: la lectura clínica, con tu médico.",
         "Tap any row with › for the full series. Ranges are indicative: clinical reading belongs with your doctor."))+"</p></div>";
  return h;
}

function visibleTabs(){
  var rt=getRT(),hide=(rt&&rt.hideTabs)||[];
  var base=["hoy","rutina","carrera","semana","progreso","viaje","manguito","reglas"];
  /* La pestaña de carrera solo aparece si hay una carrera objetivo configurada
     (kv "race"): a quien no corre no le sobra una pestaña vacía. */
  if(!S("race",null))hide=hide.concat(["carrera"]);
  return base.filter(function(t){return hide.indexOf(t)<0});
}
/* Gráfica de tendencias por carriles: cada serie en su banda (mismo eje temporal),
   con su etiqueta y último valor. Las series ruidosas se suavizan (media móvil). */
function smoothRows(rows,n){
  if(!n||rows.length<3)return rows;
  var out=[];
  for(var i=0;i<rows.length;i++){
    var a=Math.max(0,i-n+1),s=0,c=0;
    for(var j=a;j<=i;j++){s+=rows[j].v;c++}
    out.push({day:rows[i].day,v:s/c});
  }
  return out;
}
function multiChart(defs){
  var ds=defs.map(function(s){
    return {label:s.label,color:s.color,dash:s.dash,goal:s.goal,rows:smoothRows(s.rows,s.smooth)};
  }).filter(function(s){return s.rows.length>1});
  if(!ds.length)return "";
  var days=[];ds.forEach(function(s){s.rows.forEach(function(r){days.push(r.day)})});
  days.sort();
  var t0=+new Date(days[0]),t1=+new Date(days[days.length-1])||t0+1;
  var LH=32,W=320,H=ds.length*LH+16;
  var svg='<svg viewBox="0 0 '+W+" "+H+'" style="width:100%;height:auto;margin-top:8px" role="img">';
  [0,1/3,2/3,1].forEach(function(fr){
    var d=new Date(t0+fr*(t1-t0));
    var anchor=fr===0?"start":(fr===1?"end":"middle");
    svg+='<text x="'+(2+(W-4)*fr).toFixed(0)+'" y="'+(H-3)+'" fill="#8E99A8" font-size="8" font-family="monospace" text-anchor="'+anchor+'">'+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"</text>";
  });
  ds.forEach(function(s,i){
    var top=2+i*LH;
    if(i)svg+='<line x1="0" y1="'+top+'" x2="'+W+'" y2="'+top+'" stroke="#2B3442" stroke-width="0.6"/>';
    var vs=s.rows.map(function(r){return r.v});
    var vmin=Math.min.apply(null,vs),vmax=Math.max.apply(null,vs);
    if(s.goal!=null){
      vmin=Math.min(vmin,s.goal);vmax=Math.max(vmax,s.goal);
      var vpad=(vmax-vmin)*0.14||0.5;
      if(s.goal<=Math.min.apply(null,vs))vmin-=vpad*1.8;else vmin-=vpad;
      if(s.goal>=Math.max.apply(null,vs))vmax+=vpad*1.8;else vmax+=vpad;
    }
    if(vmax-vmin<1e-9){vmax+=1;vmin-=1}
    var pts=s.rows.map(function(r){
      var x=2+(W-4)*((+new Date(r.day)-t0)/((t1-t0)||1));
      var y=(top+LH-5)-(LH-17)*((r.v-vmin)/(vmax-vmin));
      return x.toFixed(1)+","+y.toFixed(1)}).join(" ");
    if(s.goal!=null){
      var gy=(top+LH-5)-(LH-17)*((s.goal-vmin)/(vmax-vmin));
      svg+='<line x1="2" y1="'+gy.toFixed(1)+'" x2="'+(W-2)+'" y2="'+gy.toFixed(1)+'" stroke="'+s.color+'" stroke-width="1.1" stroke-dasharray="3 3" opacity=".8"/>';
      svg+='<text x="'+(W-4)+'" y="'+(gy-3).toFixed(1)+'" fill="'+s.color+'" font-size="8" font-family="monospace" text-anchor="end" font-weight="600">◎ '+s.goal+"</text>";
    }
    svg+='<polyline fill="none" stroke="'+s.color+'" stroke-width="1.6"'+(s.dash?' stroke-dasharray="4 3"':"")+' stroke-linejoin="round" opacity=".95" points="'+pts+'"/>';
    svg+='<text x="4" y="'+(top+10)+'" fill="'+s.color+'" font-size="8.5" font-family="-apple-system,sans-serif" font-weight="600">'+esc(s.label)+"</text>";
    var last=s.rows[s.rows.length-1].v;
    svg+='<text x="'+(W-4)+'" y="'+(top+10)+'" fill="'+s.color+'" font-size="8.5" font-family="monospace" text-anchor="end">'+(Math.round(last*10)/10)+"</text>";
  });
  svg+="</svg>";
  return svg;
}
/* ---------- días con el registro de comida a medias ----------
   Por debajo de este umbral el día no refleja lo que se comió (falta una comida,
   o el aceite y las bebidas). Contarlos hunde las medias y, peor, hace que la app
   diga que quedan calorías por comer cuando no es verdad. Se excluyen de medias
   y gráficas de NUTRICIÓN — nunca de peso, pasos, sueño ni gasto, que vienen de
   sensores y siempre son válidos. Umbral ajustable con goal.minKcal. */
var MINLOG=900;
function minLog(){var g=S("goal",{})||{};return (g.minKcal!=null)?+g.minKcal:MINLOG}
function logOK(r){return !!r&&r.kcal_in!=null&&+r.kcal_in>=minLog()}
var NUTKEYS={kcal_in:1,carbs_g:1,protein_g:1,fat_g:1,sugar_g:1};
function pickSeries(rows,key){
  return rows.filter(function(r){return r[key]!=null&&(!NUTKEYS[key]||logOK(r))})
              .map(function(r){return {day:r.day,v:+r[key]}});
}

/* Casa un workout_log con su actividad Garmin: runs por id exacto; fuerza por
   mismo día, tipo no-running, la más cercana en hora al momento del guardado. */
function garminFor(l){
  var acts=GACT.data||[];
  var sid=l.session_id||"";
  if(sid.indexOf("garmin-")===0){
    var id=sid.slice(7);
    for(var a=0;a<acts.length;a++)if(String(acts[a].activity_id)===id)return acts[a];
    return null;
  }
  var day=acts.filter(function(x){return (x.start_time||"").slice(0,10)===l.day&&(x.type||"").indexOf("running")<0});
  if(!day.length)return null;
  if(day.length===1||!l.created_at)return day[0];
  var ct=+new Date(l.created_at);
  day.sort(function(x,y){
    var ex=+new Date(x.start_time)+(+x.duration_min||0)*60000;
    var ey=+new Date(y.start_time)+(+y.duration_min||0)*60000;
    return Math.abs(ex-ct)-Math.abs(ey-ct)});
  return day[0];
}

      gtxt=" · ⌚ "+String(g.start_time||"").slice(11,16)+
        (g.duration_min?" · "+Math.round(+g.duration_min)+" min":"")+
        (g.calories?" · "+Math.round(+g.calories)+" kcal":"");
    }
    var head='<button class="dayrow" style="margin:6px 0" data-act="hist" data-k="'+esc(key)+'">'+
      '<span class="dn" style="width:52px">'+l.day.slice(8,10)+"/"+l.day.slice(5,7)+"</span>"+
      '<span class="dt"><b>'+esc(l.title||l.session_id||"?")+"</b><small>"+(l.total_sets||0)+" "+u("setsLbl")+
      (l.est_volume>0?" · "+fmtK(+l.est_volume)+" kg":"")+esc(gtxt)+"</small></span>"+
      '<span class="tick" style="border:none;color:var(--mut)">'+(open?"▾":"▸")+"</span></button>";
    var det="";
    if(open){
      var trs=(l.entries||[]).map(function(e){
        return '<tr><td style="white-space:normal;text-transform:none;font-family:inherit;font-weight:400;color:#c6cdd6">'+esc(e.n||"")+"</td><td>"+(e.sets||"—")+"</td><td>"+esc(e.reps||e.target||"—")+"</td><td>"+(e.weight!=null?e.weight:"—")+"</td></tr>";
      }).join("");
      var noteHtml=l.note?'<p class="note" style="margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:8px;border-left:3px solid var(--acc-dim)">📝 '+esc(l.note)+"</p>":"";
      det='<div class="card" style="margin:0 0 10px"><div style="overflow-x:auto"><table class="mini"><tr><td>'+u("thEj")+"</td><td>"+u("thSets")+"</td><td>Reps</td><td>kg</td></tr>"+trs+"</table></div>"+noteHtml+"</div>";
    }
    return head+det;
  }).join("");
  return '<h2 class="sect">'+u("histT")+"</h2>"+rows;
}

var GTYPES={strength_training:B("Fuerza","Strength"),running:B("Carrera","Run"),
  treadmill_running:B("Cinta","Treadmill"),trail_running:B("Trail","Trail"),
  walking:B("Caminata","Walk"),yoga:B("Yoga","Yoga"),indoor_cardio:B("Cardio","Cardio"),
  mountaineering:B("Montaña","Mountain"),cycling:B("Bici","Cycling")};
function gactView(){
  if(GACT.data===null){loadGact();return '<div class="card"><p class="note">'+u("loading")+"</p></div>"}
  if(!GACT.data.length)return "";
  var hrL=LANG==="es"?"FC ":"HR ";
  var trs=GACT.data.slice(0,10).map(function(a){
    var iso10=(a.start_time||"").slice(0,10);
    var d=iso10.slice(8,10)+"/"+iso10.slice(5,7);
    var t=T(GTYPES[a.type]||{es:a.type||"—",en:a.type||"—"});
    var det=[];
    if(+a.distance_km>0){det.push((+a.distance_km).toFixed(1)+" km");if(a.pace)det.push(a.pace+" min/km");}
    else if(a.duration_min)det.push(Math.round(+a.duration_min)+" min");

    return "<tr><td>"+d+"</td><td>"+esc(t)+"</td><td>"+esc(det.join(" · "))+"</td></tr>";
  }).join("");
  return '<div class="card"><h3>'+u("garmT")+'</h3><div style="overflow-x:auto"><table class="mini">'+trs+"</table></div></div>";
}

/* Sparkline: curva suavizada (cuadráticas por punto medio) + área + punto final */
function spark(vals,color){
  if(!vals||vals.length<2)return "";
  var w=84,h=24,n=vals.length;
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mx-mn<1e-9){mx+=1;mn-=1}
  function X(i){return +(2+(w-4)*i/(n-1)).toFixed(1)}
  function Y(v){return +((h-3)-(h-7)*((v-mn)/(mx-mn))).toFixed(1)}
  var d="M"+X(0)+" "+Y(vals[0]);
  for(var i=1;i<n-1;i++){
    d+=" Q"+X(i)+" "+Y(vals[i])+" "+((X(i)+X(i+1))/2).toFixed(1)+" "+((Y(vals[i])+Y(vals[i+1]))/2).toFixed(1);
  }
  d+=" L"+X(n-1)+" "+Y(vals[n-1]);
  var area=d+" L"+X(n-1)+" "+(h-1)+" L"+X(0)+" "+(h-1)+" Z";
  return '<svg viewBox="0 0 '+w+" "+h+'" style="width:100%;max-width:'+w+'px;height:auto;display:block;margin-top:5px" aria-hidden="true">'+
    '<path d="'+area+'" fill="'+color+'" opacity="0.14"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+X(n-1)+'" cy="'+Y(vals[n-1])+'" r="2.2" fill="'+color+'"/></svg>';
}

/* FC a lo largo del día: curva intradía grande con eje horario (aprox.) */
/* Estrés a lo largo del día (Garmin), en cubos de MEDIA HORA en hora local.
   Un cubo puede valer:
     · un número  -> estrés medio de esa franja
     · -2         -> ESTABAS ENTRENANDO. Garmin no calcula estrés con movimiento:
                     se apoya en la variabilidad en reposo. El reloj está puesto.
     · null       -> sin dato suficiente
   Y se sombrean las franjas de descanso (rest_win): 1 sueño, 2 siesta. Eso
   convierte la gráfica en algo legible de un vistazo — dónde dormiste, cuándo
   entrenaste y qué pasó con el estrés entre medias. */
var SENTRENO="#B98BE0";
var SBANDAS=[[0,25,"#46C08A"],[25,50,"#A8C97F"],[50,75,"#E8963E"],[75,101,"#E5484D"]];
function sColor(v){
  for(var i=0;i<SBANDAS.length;i++)if(v<SBANDAS[i][1])return SBANDAS[i][2];
  return "#E5484D";
}
/* Horas de comida. MFP guarda el CUÁNTO por cajón (desayuno/comida/cena/snacks)
   pero nunca la hora del reloj, así que la hora la pone él y nosotros le pegamos
   las calorías y la proteína que ya sabemos. Solo se ofrecen los cajones en los
   que ese día hay algo registrado: pedir la hora de una cena que no existe sobra. */
var MEALKEYS=[["b","🍳",["Desayuno","Breakfast"]],["l","🥗",["Comida","Lunch"]],
              ["d","🍽","Cena|Dinner".split("|")],["w","🥤",["Batido","Shake"]],
              ["s","🍫",["Picoteo","Snack"]]];
/* Para HOY se ofrecen siempre los cajones habituales, aunque MFP no haya
   sincronizado todavía: la hora se apunta al comer, no media hora después de que
   llegue el dato. Las calorías aparecen solas cuando el sync las trae.
   Para días pasados solo se enseña lo que de verdad se comió: preguntar por una
   cena que no existió sobra. */
var MEALHOY=["b","l","d","w"];
function mealsOf(day){
  var r=rowFor(day), m=(r&&r.meals_kcal)||null;
  var hoy=(day===TODAY);
  if(!m&&!hoy)return [];
  var out=[];
  MEALKEYS.forEach(function(mk){
    var v=(m||{})[mk[0]];
    var hay=v&&v.k;
    if(!hay&&!(hoy&&MEALHOY.indexOf(mk[0])>-1))return;
    out.push({k:mk[0],ic:mk[1],nm:B(mk[2][0],mk[2][1]),
              kcal:hay?v.k:null,prot:hay?v.p:null,
              t:String(S("meal:"+day+":"+mk[0],""))});
  });
  return out;
}
function mealsCard(){
  if(runOnly())return "";
  if(!cloudOn())return "";
  var day=selDay(), ms=mealsOf(day);
  if(!ms.length)return "";
  var puestas=ms.filter(function(m){return m.t}).length;
  var h='<div class="card"><div class="exhead"><div class="tlab">🕐 '+
        T(B("Horas de comida","Meal times"))+' <span class="snum">'+puestas+"/"+ms.length+"</span></div></div>"+
        '<div class="mealgrid">';
  ms.forEach(function(m){
    h+='<div class="mealit"><span class="mealic">'+m.ic+"</span>"+
       '<span class="mealnm">'+esc(T(m.nm))+'<b>'+(m.kcal!=null?m.kcal+" kcal · "+m.prot+" g":T(B("sin registrar aún","not logged yet")))+"</b></span>"+
       '<input class="t-in" type="time" data-key="meal:'+day+":"+m.k+'" value="'+esc(m.t)+
       '" aria-label="'+esc(T(m.nm))+'"></div>';
  });
  return h+"</div></div>";
}
function stressDayCard(){
  if(!cloudOn())return "";
  if((state.dayRange||1)!==1)return "";
  var r=rowFor(selDay());
  if(!r||!Array.isArray(r.stress_curve))return "";
  var vs=r.stress_curve.map(function(v){return v==null?null:+v});
  var hay=vs.filter(function(v){return v!=null&&v>=0});
  if(hay.length<2)return "";
  var rw=Array.isArray(r.rest_win)?r.rest_win:[];
  var av=r.stress_avg!=null?r.stress_avg:Math.round(hay.reduce(function(a,b){return a+b},0)/hay.length);
  var mx=Math.max.apply(null,hay);
  var act=vs.filter(function(v){return v===-2}).length;
  var sie=rw.filter(function(v){return v===2}).length;
  var W=340,H=104,P=3,TOP=6,BASE=H-13,N=vs.length,an=(W-2*P)/N;
  function yy(v){return BASE-(BASE-TOP)*Math.min(100,v)/100}
  var svg='<svg viewBox="0 0 '+W+" "+H+'" style="width:100%;height:auto;margin-top:5px" role="img" preserveAspectRatio="none">';
  SBANDAS.forEach(function(b){
    svg+='<rect x="'+P+'" y="'+yy(Math.min(100,b[1])).toFixed(1)+'" width="'+(W-2*P)+
         '" height="'+(yy(b[0])-yy(Math.min(100,b[1]))).toFixed(1)+'" fill="'+b[2]+'" opacity=".06"/>';
  });
  /* Descanso al fondo, en azul frío: sueño oscuro, siesta más clara. Además una
     banda fina ARRIBA — el entreno tiene la suya abajo, así no se confunden. */
  rw.forEach(function(v,k){
    if(!v)return;
    var c=v===2?"#8FB3E0":"#5B84C4", x=(P+an*k).toFixed(1), w=an.toFixed(1);
    svg+='<rect x="'+x+'" y="'+TOP+'" width="'+w+'" height="'+(BASE-TOP).toFixed(1)+
         '" fill="'+c+'" opacity="'+(v===2?".30":".22")+'"/>'+
         '<rect x="'+x+'" y="'+TOP+'" width="'+w+'" height="2.4" fill="'+c+'" opacity=".85"><title>'+
         pad(Math.floor(k/2))+":"+(k%2?"30":"00")+" · "+T(v===2?B("siesta","nap"):B("durmiendo","asleep"))+"</title></rect>";
  });
  vs.forEach(function(v,k){
    if(v==null)return;
    var x=P+an*k, hh2=pad(Math.floor(k/2))+":"+(k%2?"30":"00");
    if(v===-2){
      /* Garmin marca -2 cuando hay DEMASIADO MOVIMIENTO para medir estrés, que
         se calcula sobre la variabilidad en reposo. No significa "entrenando":
         a Lorena le salió andando deprisa (772 pasos en media hora, 3-ago-2026).
         Llamarlo entrenamiento era generalizar desde el caso de Marcos.
         Violeta a propósito: el ámbar chocaba con las barras de estrés alto. */
      svg+='<rect x="'+(x+0.3).toFixed(1)+'" y="'+TOP+'" width="'+(an-0.6).toFixed(1)+'" height="'+(BASE-TOP).toFixed(1)+
           '" fill="'+SENTRENO+'" opacity=".28"/><rect x="'+(x+0.3).toFixed(1)+'" y="'+(BASE-2.4)+'" width="'+(an-0.6).toFixed(1)+
           '" height="2.4" fill="'+SENTRENO+'" opacity=".9"><title>'+hh2+" · "+T(B("en movimiento","moving"))+"</title></rect>";
      return;
    }
    svg+='<rect x="'+(x+0.3).toFixed(1)+'" y="'+yy(v).toFixed(1)+'" width="'+(an-0.6).toFixed(1)+
         '" height="'+Math.max(1,BASE-yy(v)).toFixed(1)+'" fill="'+sColor(v)+'" opacity=".92"><title>'+
         hh2+" · "+v+"</title></rect>";
  });
  /* Las comidas, en crema: ni azul (descanso) ni violeta (entreno) ni la rampa
     verde-rojo del estrés. El punto crece con las calorías. */
  mealsOf(selDay()).forEach(function(m){
    var pr=/^(\d{1,2}):(\d{2})$/.exec(m.t);
    if(!pr)return;
    var hr=+pr[1], mi=+pr[2];
    if(hr>23||mi>59)return;          /* 12:75 caería en las 13:15 si solo sumáramos */
    var mins=hr*60+mi;
    var x=(P+(W-2*P)*mins/1440).toFixed(1), rad=(2+Math.min(2.4,(m.kcal||0)/450)).toFixed(1);
    svg+='<line x1="'+x+'" y1="'+TOP+'" x2="'+x+'" y2="'+BASE+'" stroke="#EFE6D2" stroke-width="0.9" '+
         'stroke-dasharray="2 2.5" opacity=".55"/>'+
         '<circle cx="'+x+'" cy="'+(TOP+3.2)+'" r="'+rad+'" fill="#EFE6D2" opacity=".95"><title>'+
         esc(m.t+" · "+T(m.nm)+(m.kcal!=null?" · "+m.kcal+" kcal · "+m.prot+" g prot":""))+"</title></circle>";
  });
  /* Un hueco por falta de dato y un hueco porque el reloj todavía no ha volcado
     se pintaban IGUAL, y no son lo mismo. La cadena reloj → móvil → Garmin
     Connect → nuestro sync tarda, así que la parte derecha del día suele estar
     simplemente pendiente. Se sombrea a partir de la última descarga de Garmin
     para que se distinga "aún no ha llegado" de "no se pudo medir". */
  var ss=S("sync_status",null), horaSync=null;
  if(ss&&ss.garmin_t&&String(ss.garmin_t).slice(0,10)===selDay()){
    var pr=String(ss.garmin_t).slice(11,16).split(":");
    if(pr.length===2)horaSync=(+pr[0])+(+pr[1])/60;
  }
  if(horaSync!=null&&horaSync<24){
    var xs=(P+(W-2*P)*horaSync/24).toFixed(1);
    svg+='<rect x="'+xs+'" y="'+TOP+'" width="'+Math.max(0,W-P-xs).toFixed(1)+'" height="'+(BASE-TOP).toFixed(1)+
         '" fill="#8E99A8" opacity=".10"/>'+
         '<line x1="'+xs+'" y1="'+TOP+'" x2="'+xs+'" y2="'+BASE+'" stroke="#8E99A8" stroke-width="0.8" stroke-dasharray="1.5 2" opacity=".7"><title>'+
         esc(T(B("Último volcado del reloj: ","Watch last synced: "))+String(ss.garmin_t).slice(11,16))+"</title></line>";
  }
  [0,3,6,9,12,15,18,21,24].forEach(function(hh){
    var x=(P+(W-2*P)*hh/24).toFixed(1);
    svg+='<line x1="'+x+'" y1="'+TOP+'" x2="'+x+'" y2="'+BASE+'" stroke="#2B3442" stroke-width="0.4" opacity=".7"/>'+
         '<text x="'+x+'" y="'+(H-3)+'" fill="#8E99A8" font-size="7.5" font-family="monospace" text-anchor="middle">'+hh+"</text>";
  });
  svg+="</svg>";
  var Q={CALM:B("Calma","Calm"),BALANCED:B("Equilibrado","Balanced"),
         STRESSFUL:B("Estrés","Stressful"),VERY_STRESSFUL:B("Mucho estrés","Very stressful")};
  var q=r.stress_q&&Q[r.stress_q]?T(Q[r.stress_q]):"";
  var leg=[];
  if(rw.some(function(v){return v===1}))leg.push('<span class="lgd"><i style="background:#5B84C4"></i>'+T(B("sueño","sleep"))+"</span>");
  if(sie)leg.push('<span class="lgd"><i style="background:#8FB3E0"></i>'+T(B("siesta","nap"))+"</span>");
  if(horaSync!=null&&horaSync<23.5)
    leg.push('<span class="lgd"><i style="background:#8E99A8;opacity:.45"></i>'+
      T(B("sin volcar aún","not synced yet"))+"</span>");
  if(mealsOf(selDay()).some(function(m){return m.t}))leg.push('<span class="lgd"><i style="background:#EFE6D2"></i>'+T(B("comida","meal"))+"</span>");
  if(act)leg.push('<span class="lgd"><i style="background:'+SENTRENO+'"></i>'+T(B("en movimiento","moving"))+"</span>");
  return '<div class="card" style="padding:9px 8px"><div class="exhead" style="padding:0 4px"><div class="tlab strow">🧠 '+
    T(B("Estrés","Stress"))+' <span class="snum">'+av+" · "+T(B("máx","max"))+" "+mx+(q?" · "+esc(q):"")+"</span></div></div>"+
    svg+(leg.length?'<div class="lgds">'+leg.join("")+"</div>":"")+"</div>";
}

/* Texto rico compartido (parte semanal y línea base): viñetas "- ", párrafos y **negritas** */
function richBody(txt){
  var html="",list=[];
  function fmt(x){
    return esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
      .replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--acc)">$1</a>');
  }
  function flush(){if(list.length){html+='<ul class="blist">'+list.map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>";list=[]}}
  String(txt).split("\n").forEach(function(ln){
    ln=ln.trim();
    if(!ln){flush();return}
    if(ln.indexOf("- ")===0)list.push(fmt(ln.slice(2)));
    else{flush();html+='<p class="bp">'+fmt(ln)+"</p>"}
  });
  flush();
  return html;
}
