/* ---------- macros del día vs objetivo ----------
   Pauta activa (corpus, 2026-08-01): la proteína es FIJA todos los días; los
   carbohidratos y la grasa suben en los días de carga. El tipo de día se deduce
   de la sesión que toca en la rutina, así que si cambia la semana esto la sigue
   sin tocar nada. El backend puede sobrescribirlo con goal.macros. */
var MACROS={prot:160,soft:{carb:60,fat:75},hard:{carb:110,fat:80},long:{carb:130,fat:80}};
var DAYLOAD={descanso:"soft",lowA:"hard",upA:"soft",run1:"hard",runEasy:"hard",carga:"long",lowB:"hard",upB:"soft",runLong:"long"};
/* Carga del día, en orden de autoridad. Pensado para que al CAMBIAR DE RUTINA
   no haya que tocar nada aquí:
     1) goal.macros.byDay[sid]  — lo que diga el backend, manda
     2) session.load            — la propia rutina lo declara (lo natural)
     3) DAYLOAD[sid]            — la rutina integrada actual, por compatibilidad
     4) deducción               — descanso→suave, carrera→duro (larga→recarga),
                                  y una sesión de pesas cuenta como dura si más
                                  de la mitad de sus series son de pierna, que
                                  es el bloque de mayor demanda glucolítica. */
function loadOf(sid){
  var G=S("goal",{})||{},cfg=(G&&G.macros)||{};
  if(cfg.byDay&&cfg.byDay[sid])return cfg.byDay[sid];
  var s=sid&&getSession(sid);
  if(s&&s.load)return s.load;
  if(DAYLOAD[sid])return DAYLOAD[sid];
  if(!s)return "soft";
  if(s.type==="rest")return "soft";
  if(s.type==="run")return /larga|long/i.test(String(T(s.title)||""))?"long":"hard";
  var legs=0,tot=0;
  (s.items||[]).forEach(function(it,i){
    var n=it.sets?nSets(sid,i,it):0;if(!n)return;
    tot+=n;if(muscleOf(sid,i,it)==="legs")legs+=n;
  });
  return (tot&&legs/tot>=.5)?"hard":"soft";
}
function macroGoal(day){
  var G=S("goal",{})||{};
  /* Los valores por defecto son los del plan integrado. Quien tenga rutina
     propia cargada (otra cuenta de la familia) solo ve objetivos si el backend
     le manda los suyos en goal.macros: sus números no son estos. */
  var cfg=(G&&G.macros)||(getRT()?null:MACROS);
  if(!cfg)return null;
  var d=new Date(day+"T12:00:00"),idx=(d.getDay()+6)%7;
  var w=getWeek()[idx],sid=w&&w.sid;
  var kind=loadOf(sid);
  var k=cfg[kind]||cfg.soft||MACROS.soft;
  return {prot:cfg.prot||MACROS.prot,carb:k.carb,fat:k.fat,kind:kind,sid:sid};
}
/* Sueño: a qué hora se acostó, a qué hora se durmió y cuánto tardó.
   Garmin NO da la hora de acostarse. Se aproxima con el último tramo de 15 min
   con pasos de verdad antes de dormirse (bed_h, lo calcula balancetool). Está
   validado: la mediana sale 23:30 y él dice acostarse a las 23:25-23:30.
   La distinción importa porque una noche mala tiene dos causas opuestas y
   remedios opuestos: estar levantado hasta tarde, o acostarse a su hora y no
   coger el sueño. De sus 15 peores noches, 12 fueron lo primero.
   Se normaliza a horas relativas a medianoche: 23:45 -> -0,25; 01:18 -> +1,3. */
function bedNorm(h){return h==null?null:(h>=12?h-24:h)}
function bedFmt(h){
  if(h==null)return "—";
  var t=((h%24)+24)%24, hh=Math.floor(t), mm=Math.round((t-hh)*60);
  if(mm===60){mm=0;hh=(hh+1)%24}
  return pad(hh)+":"+pad(mm);
}
function medianaDe(v){
  var a=v.slice().sort(function(x,y){return x-y});
  if(!a.length)return null;
  return a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2;
}
function bedCard(){
  if(!cloudOn())return "";
  if((state.dayRange||1)!==1)return "";
  var day=selDay(), r=rowFor(day);
  var on=r?bedNorm(r.sleep_start_h):null;
  if(on==null)return "";
  var ac=r?bedNorm(r.bed_h):null, lat=r&&r.sleep_lat_min!=null?+r.sleep_lat_min:null;
  var M=(METRICS.data||[]).filter(function(x){return x.day<=day});
  var acM=medianaDe(M.filter(function(x){return x.bed_h!=null}).map(function(x){return bedNorm(x.bed_h)}));
  var latM=medianaDe(M.filter(function(x){return x.sleep_lat_min!=null}).map(function(x){return +x.sleep_lat_min}));
  /* Rojo solo cuando el dato es peor que SU costumbre, no contra una hora fija. */
  var acCls=(ac!=null&&acM!=null)?(ac>=acM+1?"bad":(ac<=acM-0.5?"ok":"")):"";
  var latCls=(lat!=null&&latM!=null)?(lat>=latM+30?"bad":(lat<=latM?"ok":"")):"";
  var cols=[
    [B("Te acostaste","In bed"),bedFmt(ac),acCls,acM!=null?bedFmt(acM):null],
    [B("Te dormiste","Asleep"),bedFmt(on),"",null],
    [B("Tardaste","Took"),lat!=null?lat+" min":"—",latCls,latM!=null?Math.round(latM)+" min":null]
  ].map(function(c){
    return '<div class="macg"><div class="macl">'+esc(T(c[0]))+"</div>"+
           '<div class="bedv '+c[2]+'">'+esc(c[1])+"</div>"+
           (c[3]?'<div class="bedm">'+T(B("normal ","usual "))+esc(c[3])+"</div>":"")+"</div>";
  }).join("");
  /* El aviso nombra la CAUSA, porque el remedio de cada una es distinto. */
  var av="";
  if(ac!=null&&acM!=null&&lat!=null&&latM!=null){
    if(ac>=acM+1)
      av=T(B("Te acostaste tarde, no es que te costara dormir.",
             "You went to bed late — falling asleep wasn't the issue."));
    else if(lat>=latM+30){
      av=T(B("Te acostaste a tu hora pero tardaste ","In bed on time but took "))+lat+
         T(B(" min en dormirte, frente a "," min to fall asleep, vs "))+Math.round(latM)+
         T(B(" de costumbre."," usually."));
      /* Y si aun así durmió lo suyo, decirlo. Tardar en dormirse no cuesta sueño
         cuando se compensa acostándose antes o levantándose después — que es lo
         que hace él: en sus noches lentas duerme lo mismo, 6,6 h. Sin este
         matiz la tarjeta alarmaba por algo que no tiene consecuencia. */
      var shM=medianaDe(M.filter(function(x){return x.sleep_h!=null}).map(function(x){return +x.sleep_h}));
      if(r.sleep_h!=null&&shM!=null)
        av+=" "+(r.sleep_h>=shM-0.3
          ? T(B("Aun así dormiste tus ","Still slept your usual "))+(+r.sleep_h).toFixed(1)+" h."
          : T(B("Y esta vez sí lo pagaste: ","And this time it cost you: "))+(+r.sleep_h).toFixed(1)+
            T(B(" h frente a tus "," h vs your usual "))+shM.toFixed(1)+".");
    }
  }
  return '<div class="card"><div class="exhead"><div class="tlab">🛏 '+
    T(B("Sueño","Sleep"))+"</div></div>"+
    '<div class="macrow">'+cols+"</div>"+
    (av?'<div class="macwarn">'+esc(av)+"</div>":"")+"</div>";
}
function macroCard(){
  if(runOnly())return "";
  if(!cloudOn())return "";
  if((state.dayRange||1)!==1)return "";          // solo en la vista de un día
  var day=selDay(),r=rowFor(day);
  if(!r&&day!==TODAY)return "";                  // día pasado sin registro: nada que enseñar
  var g=macroGoal(day);
  if(!g)return "";                               // sin objetivos aplicables a esta cuenta
  var got={prot:+((r&&r.protein_g)||0),carb:+((r&&r.carbs_g)||0),fat:+((r&&r.fat_g)||0)};
  var kcalG=Math.round(g.prot*4+g.carb*4+g.fat*9);
  /* La etiqueta dice QUÉ cambia (los carbohidratos) y POR QUÉ (la sesión del
     día). "Día suave" no se entendía: no aclaraba si lo suave era el entreno
     o la comida. La proteína no aparece aquí porque nunca varía. */
  var kindL={soft:B("carbos bajos","low carbs"),hard:B("carbos altos","high carbs"),
             long:B("recarga","refuel")}[g.kind];
  var sS=getSession(g.sid);
  var sIc=sS?(sS.type==="run"?"🏃":(sS.type==="rest"?"😴":"💪")):"";
  var sN=sS?String(T(sS.title)).split("·")[0].trim():"";
  var defs=[
    {i:"🥩",l:B("Proteína","Protein"),got:got.prot,goal:g.prot,up:true},
    {i:"🍞",l:B("Carbos","Carbs"),got:got.carb,goal:g.carb,up:false},
    {i:"🥑",l:B("Grasa","Fat"),got:got.fat,goal:g.fat,up:false}
  ];
  var cols=defs.map(function(m){
    var pct=m.goal>0?Math.min(100,Math.round(m.got/m.goal*100)):0;
    /* La proteína es un SUELO: verde al alcanzarla. Carbos y grasa son techo:
       rojo al pasarse claramente (>10%), que es cuando importa. */
    var cls=m.up?(m.got>=m.goal*.95?" ok":""):(m.got>m.goal*1.1?" over":"");
    return '<div class="macg"><div class="macl">'+m.i+" "+esc(T(m.l))+"</div>"+
      '<div class="macb"><i class="'+cls.trim()+'" style="width:'+pct+'%"></i></div>'+
      '<div class="macv">'+Math.round(m.got)+' <span>/'+m.goal+" g</span></div></div>";
  }).join("");
  var incompleto=r&&r.kcal_in!=null&&!logOK(r);
  /* El presupuesto vivía arriba, entre peso y pasos, y ahí no pegaba: es una
     cuenta de comida y su sitio es debajo de los macros, con el mismo objetivo
     del día del que sale. */
  var comido=Math.round((r&&r.kcal_in)||0), queda=kcalG-comido;
  var pctK=kcalG>0?Math.min(100,Math.round(comido/kcalG*100)):0;
  var pasado=queda<0;
  var barra='<div class="eatrow">'+
    '<div class="eatl">'+(day===TODAY?"🎯 "+T(B("Por comer","Left to eat")):"🎯 "+T(B("Balance","Balance")))+"</div>"+
    '<div class="macb" style="margin:5px 0 4px"><i class="'+(pasado?"over":"")+'" style="width:'+pctK+'%"></i></div>'+
    '<div class="eatv"><b style="color:'+(pasado?"var(--bad)":"var(--ok)")+'">'+
      (day===TODAY?(pasado?"":"")+queda:(pasado?"+":"")+(-queda))+"</b> <span>"+
      comido+" / "+kcalG+" kcal</span></div></div>";
  return '<div class="card" style="padding:11px 13px"><div class="exhead" style="margin-bottom:9px">'+
    '<div class="tlab macd">'+sIc+" "+esc(sN)+" · "+esc(T(kindL))+"</div>"+
    '<span class="macnote">'+kcalG+" kcal</span></div>"+
    '<div class="macrow">'+cols+"</div>"+barra+
    (incompleto?'<p class="macwarn">'+T(B("Registro incompleto: faltan comidas por meter, así que esto no cuadra y el día no cuenta para las medias.","Incomplete log: meals are missing, so this doesn\'t add up and the day won\'t count toward averages."))+"</p>":"")+
    "</div>";
}

/* ---------- ritmo de la semana ----------
   Cada métrica se comporta distinto y se mide como toca:
   · CALORÍAS: presupuesto SEMANAL. Un día de más lo absorbe la semana; lo que
     importa es el acumulado, no compensar al día siguiente.
   · PROTEÍNA: suelo DIARIO. La síntesis proteica es un proceso del día — lo que
     falta hoy no se recupera mañana. Por eso se cuentan días cumplidos, no medias:
     una media esconde justo los días malos.
   · ENTRENO: objetivo SEMANAL, pero sin amontonar. Se muestra qué falta, no para
     meterlo en otra sesión sino para saber dónde estás.
   Solo cuentan los días con el registro de comida completo. */
function weekPaceCard(){
  if(runOnly())return "";      /* pendiente: versión de carrera */
  if(!cloudOn()||!macroGoal(TODAY))return "";
  var M=METRICS.data;if(!M||!M.length)return "";
  var lun=mondayOf(TODAY);
  var dias=[];for(var i=0;i<7;i++){var d=new Date(lun+"T12:00:00");d.setDate(d.getDate()+i);dias.push(iso(d))}
  /* Comida: solo días CERRADOS. Un día en curso no se compara con un objetivo
     diario — a media mañana diría que vas en déficit enorme, y es falso. El día
     de hoy ya lo cubre la fila de macros. El entreno sí cuenta hoy: o está hecho
     o no lo está. */
  var hasta=dias.filter(function(d){return d<TODAY});
  var porDia={};M.forEach(function(r){porDia[r.day]=r});

  var difK=0,nK=0,protOK=0,nP=0,incompletos=0;
  hasta.forEach(function(d){
    var r=porDia[d],g=macroGoal(d);if(!g)return;
    if(!r||r.kcal_in==null)return;
    if(!logOK(r)){incompletos++;return}
    difK+=(+r.kcal_in)-(g.prot*4+g.carb*4+g.fat*9);nK++;
    nP++;if((+r.protein_g||0)>=g.prot)protOK++;
  });

  /* Se cuentan DÍAS con sesión de fuerza guardada, no coincidencias exactas de
     día+sesión. Dos motivos: la app deja reordenar la semana, así que hacer el
     Lower A un jueves no es un fallo; y si cambian los identificadores de sesión
     (como al rehacer la rutina), lo antiguo dejaría de casar y parecería que no
     has entrenado. El bloque de manguito no cuenta como sesión: es accesorio. */
  var plan=0,faltan=[],WK=getWeek(),logs=LOGS.data||[],planSid={};
  dias.forEach(function(d,i){
    var w=WK[i];if(!w)return;
    /* Un día puede llevar fuerza ADEMÁS de la carrera (campo `plus`). Si solo
       se mirase el sid del día, la sesión de torso del jueves no contaría y el
       contador diría 2/2 habiendo tres. */
    [w.sid,w.plus].forEach(function(sd){
      if(!sd)return;
      var ses=getSession(sd);
      if(!ses||ses.type!=="gym")return;
      plan++;planSid[sd]=String(T(ses.title)).split("·")[0].trim();
    });
  });
  var conFuerza={};
  logs.forEach(function(l){
    if(dias.indexOf(l.day)<0)return;
    if(l.session_id==="manguito"||l.session_id==="activo")return;
    if(!(l.total_sets>1))return;
    conFuerza[l.day]=1;
  });
  var hechas=Object.keys(conFuerza).length;
  /* Solo se nombra lo que falta si de verdad faltan días; si ya has hecho tantas
     sesiones como tocaban, dar nombres sobraría (y con los sids cambiados sería
     engañoso). */
  if(hechas<plan){
    for(var sd in planSid){
      if(!logs.some(function(l){return dias.indexOf(l.day)>=0&&l.session_id===sd}))
        faltan.push(planSid[sd]);
    }
    if(faltan.length>plan-hechas)faltan=faltan.slice(0,plan-hechas);
  }

  if(!nK&&!plan)return "";
  var g0=macroGoal(TODAY);
  var col=Math.abs(difK)<=250?"var(--ok)":(difK>0?"var(--warn)":"var(--mut)");
  var fil=[];
  if(nK)fil.push(['🍽️',T(B("Calorías","Calories")),
    '<b style="color:'+col+'">'+(difK>0?"+":"")+Math.round(difK)+"</b> kcal",
    nK+" "+T(B("días cerrados","closed days"))+(incompletos?" · "+incompletos+" "+T(B("incompleto","incomplete"))+(incompletos>1?"s":""):"")+" · "+T(B("hoy aparte","today separate"))]);
  if(nP)fil.push(['🥩',T(B("Proteína","Protein")),
    '<b style="color:'+(protOK===nP?"var(--ok)":(protOK>=nP*0.6?"var(--acc)":"var(--warn)"))+'">'+protOK+"/"+nP+"</b> "+T(B("días","days")),
    T(B("suelo ","floor "))+g0.prot+" g · "+T(B("no se compensa","no catching up"))]);
  if(plan)fil.push(['💪',T(B("Entreno","Training")),
    '<b style="color:'+(hechas>=plan?"var(--ok)":"var(--acc)")+'">'+hechas+"/"+plan+"</b> "+T(B("sesiones","sessions")),
    hechas>=plan?T(B("al día","on track")):
      (faltan.length?T(B("falta ","missing "))+faltan.join(", "):
       (plan-hechas)+" "+T(B("por hacer","to go")))]);

  return '<div class="card" style="padding:11px 13px"><div class="exhead" style="margin-bottom:8px">'+
    '<div class="tlab">'+T(B("Esta semana","This week"))+'</div><span class="macnote">'+
    lun.slice(8,10)+"/"+lun.slice(5,7)+" – "+dias[6].slice(8,10)+"/"+dias[6].slice(5,7)+"</span></div>"+
    fil.map(function(f){
      return '<div class="wkrow"><span class="wki">'+f[0]+'</span><span class="wkl">'+esc(f[1])+
        '</span><span class="wkv">'+f[2]+'</span><span class="wks">'+esc(f[3])+"</span></div>";
    }).join("")+"</div>";
}

/* Resumen en Hoy: pasos, sueño, HRV, FC reposo, kcal in/out.
   Día seleccionado con flechas (state.dayOff) y rango 1/7/30 (state.dayRange: >1 = medias). */
function dayCard(){
  if(!cloudOn())return "";
  if(METRICS.data===null){loadMetrics();return ""}
  var M=METRICS.data;if(!M.length)return "";
  var day=selDay(),rng=state.dayRange||1;
  var r=rowFor(day);
  if(!r&&(state.dayOff||0)===0)r=M[M.length-1];
  r=r||{day:day};
  function v(x,f){return (x==null)?"—":(f?f(x):x)}
  function win(key){
    var span=rng===1?7:rng;
    var st0=new Date(day+"T12:00");st0.setDate(st0.getDate()-(span-1));var sS=iso(st0);
    var out=[];M.forEach(function(x){
      if(x.day<sS||x.day>day||x[key]==null)return;
      if(NUTKEYS[key]&&!logOK(x))return;      // día a medias: no promedia
      out.push(+x[key]);
    });
    return out;
  }
  function avg(arr){if(!arr.length)return null;var s=0;arr.forEach(function(x){s+=x});return s/arr.length}
  function val(key,f){return rng===1?v(r[key],f):v(avg(win(key)),f)}
  var stepsSpark=(rng===1&&Array.isArray(r.steps_curve)&&r.steps_curve.length>1)?
    spark(r.steps_curve,"#F0A63C"):spark(win("steps"),"#F0A63C");
  var slV;
  if(rng===1)slV=r.sleep_h!=null?(+r.sleep_h).toFixed(1)+" h"+(r.sleep_score?" · "+r.sleep_score:""):"—";
  else{var sh=avg(win("sleep_h")),sc=avg(win("sleep_score"));slV=sh==null?"—":sh.toFixed(1)+" h"+(sc?" · "+Math.round(sc):"")}
  var wRow=null;
  for(var wi=M.length-1;wi>=0;wi--){if(M[wi].day<=day&&M[wi].weight_kg!=null){wRow=M[wi];break}}
  function wwin(){
    var span=rng===1?14:rng;
    var st1=new Date(day+"T12:00");st1.setDate(st1.getDate()-(span-1));var sS1=iso(st1);
    var out=[];M.forEach(function(x){if(x.day>=sS1&&x.day<=day&&x.weight_kg!=null)out.push(+x.weight_kg)});
    return out;
  }
  var wVal;
  if(rng===1)wVal=wRow?(+wRow.weight_kg).toFixed(1)+" kg":"—";
  else{var wa=avg(win("weight_kg"));wVal=wa==null?"—":wa.toFixed(1)+" kg"}
  var fRow=null;
  for(var fi=M.length-1;fi>=0;fi--){if(M[fi].day<=day&&M[fi].body_fat_pct!=null){fRow=M[fi];break}}
  function fwin(){
    var span=rng===1?14:rng;
    var st2=new Date(day+"T12:00");st2.setDate(st2.getDate()-(span-1));var sS2=iso(st2);
    var out=[];M.forEach(function(x){if(x.day>=sS2&&x.day<=day&&x.body_fat_pct!=null)out.push(+x.body_fat_pct)});
    return out;
  }
  /* El VO2max solo lo calcula Garmin los días de carrera al aire libre, así que
     es disperso: se enseña el último conocido, como el peso. */
  var vRow=null;
  for(var vi=M.length-1;vi>=0;vi--){if(M[vi].day<=day&&M[vi].vo2max!=null){vRow=M[vi];break}}
  function vwin(){
    var out=[];M.forEach(function(x){if(x.day<=day&&x.vo2max!=null)out.push(+x.vo2max)});
    return out.slice(-12);
  }
  var vVal=vRow?(+vRow.vo2max).toFixed(1):"—";
  var fVal;
  if(rng===1)fVal=fRow?(+fRow.body_fat_pct).toFixed(1)+" %":"—";
  else{var fa=avg(win("body_fat_pct"));fVal=fa==null?"—":fa.toFixed(1)+" %"}
  ensureGoal();
  var GG=S("goal",{})||{};
  function gtag(v){return v?' <span style="font-size:11px;color:var(--mut);font-weight:400">◎ '+v+"</span>":""}
  /* Los km del día al lado de los pasos. Es la distancia que Garmin deriva de
     los propios pasos, así que las dos cifras cuentan lo mismo y no se
     contradicen. En vista de varios días, la media. */
  function kmTag(){
    var k=rng===1?(r.distance_km!=null?+r.distance_km:null):avg(win("distance_km"));
    if(k==null||!(k>0))return "";
    return ' <span style="font-size:11px;color:var(--mut);font-weight:400">· '+
           k.toFixed(1)+" km</span>";
  }
  var tiles=[];
  if(!runOnly())tiles.push(
    ["⚖️ "+T(B("Peso","Weight")),wVal+gtag(GG.weight_kg),null,spark(wwin(),"#C88BD8")],
    ["🧈 "+u("bodyFat"),fVal+gtag(GG.body_fat_pct),null,spark(fwin(),"#46C08A")]);
  tiles.push(
    ["👣 "+u("dSteps"),val("steps",function(x){return Math.round(x).toLocaleString()})+kmTag(),null,stepsSpark],
    ["😴 "+u("dSleep"),slV,rng===1?r.sleep_q:null,spark(win("sleep_h"),"#46C08A")],
    ["💓 HRV",val("hrv_ms",function(x){return Math.round(x)+" ms"}),rng===1?r.hrv_q:null,spark(win("hrv_ms"),"#4DD0C0")],
    ["🫀 "+u("dRhr"),val("rhr",function(x){return Math.round(x)}),null,
      (rng===1&&Array.isArray(r.hr_curve)&&r.hr_curve.length>1)?spark(r.hr_curve,"#E5484D"):spark(win("rhr"),"#E5484D")],
    ["🔥 Kcal out",val("kcal_out",function(x){return Math.round(x)}),null,spark(win("kcal_out"),"#E8963E")],
    ["🫁 VO₂max",vVal,null,spark(vwin(),"#7BD8C0")]);
  if(!runOnly())tiles.splice(tiles.length-1,0,
    ["🍽️ Kcal in",val("kcal_in",function(x){return Math.round(x)}),null,spark(win("kcal_in"),"#7BA1D9")]);
  /* Presupuesto del día. Sale del MISMO objetivo que la fila de macros, para
     que la app no cuente dos historias distintas: antes era una base fija
     (goal.eat) más las calorías activas, y en días de entreno eso se desviaba
     del plan y además invitaba a "comerse" el entrenamiento. El modo anterior
     sigue disponible poniendo goal.eatMode = "base+active". */
  var rsel='<span class="rng">'+[[1,T(B("Día","Day"))],[7,"7d"],[30,"30d"]].map(function(p){
    return '<button data-act="dayrange" data-r="'+p[0]+'"'+(rng===p[0]?' class="sel"':"")+'>'+p[1]+"</button>"}).join("")+"</span>";
  return '<div class="card"><div class="exhead" style="margin-bottom:9px"><div class="tlab">'+u("bodyT")+"</div>"+rsel+"</div><div class=\"dgrid\">"+tiles.map(function(t){
    return '<div><div class="tlab">'+t[0]+'</div><div class="dval">'+t[1]+"</div>"+qualSub(t[2])+(t[3]||"")+"</div>"}).join("")+"</div>"+
    (rng===1&&r.day!==day?'<p class="note" style="font-size:11px;color:var(--mut);margin-top:8px">'+r.day+"</p>":"")+srcLine()+"</div>";
}

function balanceView(){
  var M=METRICS.data,h="";
  var wR=M.filter(function(r){return r.weight_kg!=null});
  var fR=M.filter(function(r){return r.body_fat_pct!=null});
  var lastW=wR[wR.length-1],lastF=fR[fR.length-1];

  // tendencias (primera tarjeta): todas las curvas en carriles, mismo eje temporal
  var rng=state.balRange||90;
  function rngSwitch(){return rangeSel(rng,"balrange")}
  var cut=new Date();cut.setDate(cut.getDate()-rng);var cutS=iso(cut);
  var m90=M.filter(function(r){return r.day>=cutS});
  ensureGoal();
  var goal=S("goal",{})||{};
  var allDefs=[
    {rows:pickSeries(m90,"weight_kg"),color:"#F0A63C",label:u("thPeso"),goal:goal.weight_kg},
    {rows:pickSeries(m90,"body_fat_pct"),color:"#46C08A",label:u("bodyFat"),goal:goal.body_fat_pct},
    {rows:pickSeries(m90,"kcal_in"),color:"#7BA1D9",label:"Kcal in",smooth:3},
    {rows:pickSeries(m90,"kcal_out"),color:"#E5484D",label:"Kcal out",smooth:3},
    {rows:pickSeries(m90,"carbs_g"),color:"#C88BD8",label:u("legC"),smooth:3},
    {rows:pickSeries(m90,"protein_g"),color:"#4DD0C0",label:u("legP"),smooth:3},
    {rows:pickSeries(m90,"fat_g"),color:"#D88B9E",label:u("legFdiet"),smooth:3}
  ];

     srcLine()+

  // peso y grasa: carriles separados (sin solape), mismo motor que Tendencias

    var bw={};eat.forEach(function(r){var kk=mondayOf(r.day);(bw[kk]=bw[kk]||[]).push(r)});
    mrows=Object.keys(bw).sort().map(function(kk){

    });
  }else mrows=eat;
  if(mrows.length){
    var mx=1;mrows.forEach(function(r){if(+r.kcal_in>mx)mx=+r.kcal_in});
    var showN=mrows.length<=15,step=Math.max(1,Math.ceil(mrows.length/10));
    var cols=mrows.map(function(r,ix){
      var c4=(+r.carbs_g||0)*4,p4=(+r.protein_g||0)*4,f9=(+r.fat_g||0)*9,tot=c4+p4+f9||1;
      var hp=Math.round((+r.kcal_in)/mx*100);

        '<div style="height:'+hf+'px;background:#7BA1D9;border-radius:3px 3px 0 0"></div>'+
        '<div style="height:'+hpr+'px;background:#46C08A"></div>'+
        '<div style="height:'+hc+'px;background:#F0A63C"></div></div>'+
        '<span class="cl">'+(ix%step===0?r.day.slice(8,10)+"/"+r.day.slice(5,7):"")+"</span></div>";
    }).join("");
    h+='<div class="card"><div class="exhead"><h3>'+u("macros14")+"</h3>"+rangeSel(mrng,"macrange")+'</div><div class="cols" style="height:130px">'+cols+"</div>"+

  }


  // tabla semanal
  var byweek={};
  M.forEach(function(r){var m=mondayOf(r.day);(byweek[m]=byweek[m]||[]).push(r)});
  var weeks=Object.keys(byweek).sort().slice(-8);
  if(weeks.length){
    var trs=weeks.map(function(wk){
      var rs=byweek[wk],eatw=rs.filter(logOK);
      var inc=rs.filter(function(r){return r.kcal_in!=null&&!logOK(r)}).length;
      var kin=eatw.length?Math.round(eatw.reduce(function(a,r){return a+ +r.kcal_in},0)/eatw.length):"—";
      var cb=eatw.length?Math.round(eatw.reduce(function(a,r){return a+(+r.carbs_g||0)},0)/eatw.length):"—";
      var outw=rs.filter(function(r){return r.kcal_out!=null});
      var kout=outw.length?Math.round(outw.reduce(function(a,r){return a+ +r.kcal_out},0)/outw.length):"—";
      var wsr=rs.filter(function(r){return r.weight_kg!=null});
      var peso=wsr.length?(+wsr[0].weight_kg).toFixed(1)+"→"+(+wsr[wsr.length-1].weight_kg).toFixed(1):"—";
      var fsr=rs.filter(function(r){return r.body_fat_pct!=null});
      var fat=fsr.length?(+fsr[fsr.length-1].body_fat_pct).toFixed(1):"—";
      var d=new Date(wk+"T12:00:00");
      return "<tr><td>"+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"</td><td>"+eatw.length+(inc?' <span style="color:var(--warn)" title="'+esc(T(B("días incompletos, no contados","incomplete days, not counted")))+'">+'+inc+"</span>":"")+"</td><td>"+kin+"</td><td>"+cb+"</td><td>"+kout+"</td><td>"+peso+"</td><td>"+fat+"</td></tr>";
    }).join("");
    h+='<div class="card"><h3>'+u("weeklyT")+'</h3><div style="overflow-x:auto"><table class="mini" style="min-width:430px"><tr>'+
       "<td>"+u("thW")+"</td><td>"+u("thReg")+"</td><td>"+u("thIn")+"</td><td>"+u("thCarbs")+"</td><td>"+u("thOut")+"</td><td>"+u("thPeso")+"</td><td>"+u("thGrasa")+"</td></tr>"+trs+"</table></div></div>";
  }

}

/* ---------- wake lock: pantalla despierta mientras corre un temporizador ---------- */
var wakeL=null;
function wakeOn(){
  try{
    if(navigator.wakeLock&&!wakeL)
      navigator.wakeLock.request("screen").then(function(l){
        wakeL=l;l.addEventListener("release",function(){wakeL=null});
      },function(){});
  }catch(e){}
}

/* ¿Qué toca después? Series pendientes del ejercicio actual, o el siguiente
   ejercicio con series (en el orden visible del usuario), o sesión completa. */
function nextSetMsg(sid,lastI){
  var s=getSession(sid);if(!s||!s.items)return "";
  var st=S(setsKey(sid),{});
  var it=s.items[lastI],arr=st[lastI]||[],ns=it?nSets(sid,lastI,it):0;
  if(it)for(var j=0;j<ns;j++)
    if(!arr[j])return T(it.n)+" · "+u("serieLbl")+" "+(j+1)+"/"+ns;
  var ord=orderedIdx(sid,s.items),pos=ord.indexOf(lastI);
  for(var k=pos+1;k<ord.length;k++){
    var oi=ord[k],it2=s.items[oi],ns2=nSets(sid,oi,it2);
    if(!ns2)continue;
    var a2=st[oi]||[];
    for(var j2=0;j2<ns2;j2++)
      if(!a2[j2])return u("nextLbl")+" "+T(it2.n)+" · "+u("serieLbl")+" "+(j2+1)+"/"+ns2;
  }
  return u("sessDone");
}

/* ---------- rest timer (basado en hora real: sobrevive al segundo plano) ---------- */
var rest={t:null,endAt:0,done:true,sid:null,i:-1};
function restStart(sec,sid,i){
  clearInterval(rest.t);
  rest.endAt=Date.now()+sec*1000;rest.done=false;rest.sid=sid||null;rest.i=(i===undefined?-1:i);
  document.getElementById("sheet").classList.add("show");
  var lab=document.getElementById("tlab");
  if(lab){
    var nx=rest.sid?nextSetMsg(rest.sid,rest.i):"";
    lab.textContent=nx?(nx.length>34?nx.slice(0,33)+"…":nx):u("rest");
  }
  wakeOn();
  var nx2=rest.sid?nextSetMsg(rest.sid,rest.i):"";
  schedulePush(sec,nx2||u("rest"));
  restTick();rest.t=setInterval(restTick,500);
}
function restStop(){
  rest.done=true;clearInterval(rest.t);
  document.getElementById("sheet").classList.remove("show");
  if(!isoST.running)wakeOff();
}
function restTick(){
  if(rest.done)return;
  var n=document.getElementById("tnum");if(!n)return;
  var left=Math.max(0,Math.ceil((rest.endAt-Date.now())/1000));
  n.textContent=Math.floor(left/60)+":"+pad(left%60);
  if(left<=0){
    restStop();beep();
    var nx=rest.sid?nextSetMsg(rest.sid,rest.i):"";
    notifyEnd(nx?u("restDoneShort")+" · "+nx:u("restDone"));
  }
}

/* ---------- iso timer (basado en hora real) ---------- */

/* ---------- pull-to-refresh: tirón hacia abajo desde el tope = recargar todo ---------- */
var refreshing=false;
function ptrEl(){return document.getElementById("ptr")}
function doRefresh(){
  if(refreshing)return;
  refreshing=true;

  LOGS.data=null;METRICS.data=null;GACT.data=null;LASTUP=null;LASTUPloading=false;
  var fin=function(){refreshing=false;if(p)p.style.display="none";render(true);};
  if(cloudOn()){
    Promise.all([pullAll(),loadProfile()]).then(function(){render(true);setTimeout(fin,900);},function(){fin()});
  }else{render(true);setTimeout(fin,500);}
}
(function(){
  var sy=null,armed=false;
  window.addEventListener("touchstart",function(e){
    sy=(window.scrollY<=0&&e.touches.length===1)?e.touches[0].clientY:null;
    armed=false;
  },{passive:true});
  window.addEventListener("touchmove",function(e){
    if(sy===null||refreshing)return;
    if(window.scrollY>0){sy=null;armed=false;var p=ptrEl();if(p)p.style.display="none";return}
    var dy=e.touches[0].clientY-sy,p2=ptrEl();
    if(dy>90&&!armed){armed=true;if(p2){p2.textContent=u("ptrPull");p2.style.display="block";}}

    else if(!refreshing){var p=ptrEl();if(p)p.style.display="none";}
    sy=null;armed=false;
  });
})();

/* ---------- iOS: recolocar los elementos fijos tras cerrar el teclado ----------
   En iOS el teclado encoge el viewport visual. Al cerrarse, los elementos con
   position:fixed (la nav y el sheet del temporizador) pueden quedarse anclados a
   esa altura reducida: aparecen a media pantalla, con contenido por debajo.
   Se dispara al perder el foco un campo, al cambiar el viewport visual y al
   girar. Un scroll de 1 px y un toque al transform obligan a WebKit a
   recomponer la capa; si el bug no está presente, no se nota nada. */
var _relayT=null;
function relayoutFixed(){
  if(_relayT)return;
  _relayT=setTimeout(function(){
    _relayT=null;
    try{
      var y=window.scrollY||window.pageYOffset||0;
      window.scrollTo(0,y+1);window.scrollTo(0,y);
      [document.querySelector("nav"),document.getElementById("sheet")].forEach(function(el){
        if(!el)return;
        el.style.transform="translateZ(0)";
        void el.offsetHeight;          // fuerza reflujo antes de devolverlo al CSS
        el.style.transform="";
      });
    }catch(e){}
  },150);
}
document.addEventListener("focusout",relayoutFixed,true);
window.addEventListener("orientationchange",relayoutFixed);
if(window.visualViewport)window.visualViewport.addEventListener("resize",relayoutFixed);

/* ---------- migración única a la rutina v96 ----------
   La semana pasó a sids nuevos (lowA/upA/lowB/upB) para que un peso guardado no
   acabara en un ejercicio distinto al cambiar el orden. Pero la mayoría de los
   ejercicios son los mismos de antes, así que su peso SÍ debe viajar: aquí se
   copia por correspondencia exacta, una sola vez y sin pisar nada ya escrito.
   El floor press toma el peso del "pesado" de la Upper A antigua, que es el que
   se corresponde con el nuevo (4×6-10, el press progresable). */
(function(){
  try{
    if(S("migr96",false))return;
    var MAP=[
      ["upperA:1","upA:1"],   /* press inclinado 30°      */
      ["upperA:5","upA:2"],   /* remo en polea sentado    */
      ["upperA:3","upA:3"],   /* cruces en polea baja     */
      ["upperA:6","upA:4"],   /* tríceps cuerda           */
      ["upperA:7","upA:5"],   /* curl con barra           */
      ["upperA:2","upB:1"],   /* floor press pesado       */
      ["upperB:1","upB:1"],   /* floor press (respaldo)   */
      ["upperA:4","upB:2"],   /* jalón neutro estrecho    */
      ["upperB:4","upB:3"],   /* remo mancuerna en banco  */
      ["upperB:6","upB:5"],   /* curl martillo            */
      ["upperB:7","upB:6"],   /* farmer carry             */
      ["lowerA:1","lowA:1"],  /* sentadilla SSB           */
      ["lowerA:2","lowA:2"],  /* peso muerto rumano       */
      ["lowerA:3","lowA:3"],  /* zancada búlgara          */
      ["lowerA:6","lowA:5"],  /* pallof press             */
      ["lowerA:4","lowB:1"],  /* hip thrust               */
      ["lowerA:5","lowB:5"]   /* elevación de talones     */
    ];
    var n=0;
    MAP.forEach(function(p){
      var v=S("w:"+p[0],"");
      if(v===""||v==null)return;
      if(String(S("w:"+p[1],""))!=="")return;   // ya hay peso nuevo: no tocar
      W("w:"+p[1],v);n++;
    });
    W("migr96",true);
    if(n)try{console.log("Fitmet: "+n+" pesos migrados a la rutina nueva")}catch(e){}
  }catch(e){}
})();

ensurePushSub();
render();
</script>
