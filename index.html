<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12151A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fitmet</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#12151A; --surface:#1A2028; --surface2:#222A35; --line:#2B3442;
  --text:#EDF0F4; --mut:#8E99A8; --acc:#F0A63C; --acc-dim:#7a5a25;
  --ok:#46C08A; --warn:#E8963E; --bad:#E5484D;
  --r:14px;
  --disp:'Avenir Next Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.app{max-width:560px;margin:0 auto;padding:0 14px}
/* Ninguna pestaña puede ser más corta que la pantalla: evita el bug de WebKit
   que desplaza los elementos fixed tras el rebote en páginas sin scroll. */
main#view{min-height:100vh}
a{color:var(--acc)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}

header{padding:calc(18px + env(safe-area-inset-top,0px)) 2px 10px}
.topline{display:flex;justify-content:space-between;align-items:center}
.topright{display:flex;align-items:center;gap:8px}
.acct{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--disp);font-weight:700;font-size:13px;color:var(--mut);display:grid;place-items:center;padding:0}
.acct.on{border-color:var(--acc);color:var(--acc)}
.fin{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font-size:16px;margin-top:8px}
.abtn{margin-top:12px;width:100%;padding:12px;border-radius:10px;background:var(--acc);color:#12151A;font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:15px}
.abtn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;margin-top:10px;display:none}
.err.show{display:block}
.okmsg{color:var(--ok);font-size:14px;margin-top:10px;display:none}
.okmsg.show{display:block}
.donebox{padding:8px 12px}
.doneline{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.doneline .di{font-size:14px}
.doneline b{font-weight:600}
.doneline small{color:var(--mut);margin-left:auto;white-space:nowrap;font-family:var(--mono);font-size:11px}
.ach{display:flex;flex-wrap:nowrap;gap:6px;margin-top:10px}
.dmv{display:flex;flex-direction:column;gap:1px;margin:0 8px;font-size:11px;color:var(--mut)}
.dmv span{padding:2px 6px}
button.wkhead{display:flex;justify-content:space-between;align-items:center;width:100%;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.01em;color:inherit;cursor:pointer;text-align:left}
.wkhead .chev{color:var(--mut);font-size:13px;margin-left:10px}
.nsw{display:inline-flex;gap:4px;margin-left:2px}
.nsb{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--mut);font-size:15px;line-height:1}
.nsb:disabled{opacity:.3}
.jtab{width:100%;margin-top:12px;font-size:13px;border-collapse:collapse}
.jtab td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
.jtab .jd{color:var(--mut);font-family:var(--mono);font-size:11px;white-space:nowrap;padding-right:12px;width:1%}
.bp{font-size:13.5px;line-height:1.5;margin:7px 0}
.blist{margin:6px 0 6px 4px;padding-left:16px;font-size:13.5px;line-height:1.55}
.blist li{margin:3px 0}
.achb{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);opacity:.4;white-space:nowrap;min-width:0}
.achb.on{opacity:1;border-color:var(--acc-dim);background:rgba(240,166,60,.12)}
.achb .ai{font-size:14px}
.achb .al{font-family:var(--disp);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.achb.on .al{color:var(--acc)}
.hab{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center;row-gap:12px;column-gap:8px;margin-top:10px}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 8px}
.dnav b{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.dnav button{background:var(--surface2);border:1px solid var(--line);color:inherit;border-radius:9px;width:40px;height:32px;font-size:16px;line-height:1}
.dnav button:disabled{opacity:.25}
.habb{width:42px;height:42px;border-radius:50%;font-size:19px;border:1.5px solid var(--line);background:var(--surface2);opacity:.45;position:relative;padding:0}
.habb.on{opacity:1;border-color:var(--acc);background:rgba(240,166,60,.14)}
.habb.on::after{content:"✓";position:absolute;right:-3px;top:-3px;background:var(--acc);color:#12151A;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;line-height:16px}
.dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 8px}
.dgrid .dval{font-family:var(--disp);font-weight:700;font-size:19px;margin-top:2px}
.dgrid .tlab{font-size:10.5px}
.dgrid .dsub{font-family:var(--disp);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.syncnote{font-size:13px;color:var(--mut);margin:6px 2px}
.syncnote a{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0}
.bar .bl{width:88px;font-size:12px;color:var(--mut);text-transform:uppercase;font-family:var(--disp);font-weight:600;letter-spacing:.04em}
.bar .bt{flex:1;height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}
.bar .bf{height:100%;background:var(--acc);border-radius:7px}
.bar .bv{font-family:var(--mono);font-size:12px;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:12px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.cols .cb{width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.cols .cl{font-size:10px;color:var(--mut);font-family:var(--mono);white-space:nowrap}
.exrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.exrow:first-of-type{border-top:none}
.exrow .xn{color:#c6cdd6;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exrow .xv{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.exrow .up{color:var(--ok)}
.exrow .fl{color:var(--mut)}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--acc);font-weight:600;display:flex;align-items:baseline;gap:7px}
.ver{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.04em;padding:1px 6px;border:1px solid var(--line);border-radius:99px}
.langsw{display:flex;gap:2px;border:1px solid var(--line);border-radius:99px;padding:2px}
.langsw button{font-size:16px;line-height:1;padding:3px 8px;border-radius:99px;filter:grayscale(1) opacity(.55);transition:filter .15s,background .15s}
.langsw button.sel{background:var(--surface2);filter:none}
h1.day{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:34px;line-height:1.05;letter-spacing:.01em;text-wrap:balance;margin-top:2px}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.phase{display:flex;align-items:center;gap:8px;margin-top:10px;padding:5px 10px;background:linear-gradient(90deg,rgba(240,166,60,.14),rgba(240,166,60,.04));border:1px solid var(--acc-dim);border-radius:9px;font-size:11px;color:#f4c47c;line-height:1.35}
.phase b{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--acc);white-space:nowrap}

.strip{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 2px}
.strip span{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 7px}
.strip span.hot{color:var(--acc);border-color:var(--acc-dim)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h3{font-family:var(--disp);text-transform:uppercase;font-weight:700;font-size:18px;letter-spacing:.02em}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dose{font-family:var(--mono);font-size:13px;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);background:var(--surface2);border-radius:6px;padding:2px 7px}
.chip.g{color:#8fd8b6}
.chip.a{color:#f4c47c}

.setrow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface2);font-family:var(--mono);font-size:14px;color:var(--mut);transition:background .15s,border-color .15s}
.pill.on{background:var(--acc);border-color:var(--acc);color:#12151A;font-weight:700}
.w-wrap{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--mut);font-size:13px}
/* 16px mínimo: por debajo, iOS hace auto-zoom al enfocar el campo */
.w-in{width:70px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:16px var(--mono);padding:6px 8px;text-align:right}

.note-in{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:16px;margin-top:10px;font-family:inherit;resize:vertical;min-height:44px}
.rng{display:flex;gap:4px}
.rng button{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border:1px solid var(--line);border-radius:99px;color:var(--mut)}
.rng button.sel{color:var(--acc);border-color:var(--acc-dim);background:rgba(240,166,60,.1)}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:24px;height:15px;font-size:8px;line-height:1;color:var(--mut);background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0}
.mv button:disabled{opacity:.22}
.exfoot{display:flex;gap:14px;margin-top:12px;font-size:13.5px}
.howbtn{color:var(--mut);text-decoration:underline;text-underline-offset:3px}
.how{display:none;margin-top:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:14px;color:#c6cdd6;border-left:3px solid var(--acc-dim)}
.how.open{display:block}
.lrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35;color:#c6cdd6}
.lrow:first-of-type{border-top:none;padding-top:12px}
.lrow .lt{flex:1;min-width:0}
.lrow .lchev{color:var(--mut);font-size:17px;line-height:1}
.ytl{text-decoration:none;font-weight:600}
.ytl::after{content:" ▶";font-size:11px}

.note{color:#c6cdd6;font-size:14.5px}
.big{font-family:var(--disp);font-size:44px;font-weight:700;text-transform:uppercase;line-height:1;color:var(--acc)}
.runcard{text-align:left}
.donebtn{margin-top:12px;width:100%;padding:12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:15px}
.donebtn.on{background:rgba(70,192,138,.15);border-color:var(--ok);color:var(--ok)}

.pain{margin:16px 0}
.painbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.painbtns button{padding:12px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-family:var(--disp);text-transform:uppercase;font-weight:600;font-size:14px;letter-spacing:.04em}
.painbtns .p0.sel{border-color:var(--ok);color:var(--ok);background:rgba(70,192,138,.12)}
.painbtns .p1.sel{border-color:var(--warn);color:var(--warn);background:rgba(232,150,62,.12)}
.painbtns .p2.sel{border-color:var(--bad);color:var(--bad);background:rgba(229,72,77,.12)}
.painmsg{margin-top:10px;font-size:14px;color:#c6cdd6;display:none;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.painmsg.show{display:block}

.dayrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin:8px 0}
.dayrow .dn{font-family:var(--disp);text-transform:uppercase;font-weight:700;font-size:17px;width:46px;color:var(--mut)}
.dayrow.today .dn{color:var(--acc)}
.dayrow .dt{flex:1}
.dayrow .dt b{display:block;font-size:15.5px;font-weight:600}
.dayrow .dt small{color:var(--mut);font-size:13px}
.tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--ok)}
.tick.on{border-color:var(--ok);background:rgba(70,192,138,.12)}
.dayrow.today{border-color:var(--acc-dim)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0;gap:4px}
.seg button{padding:10px 4px;border-radius:9px;font-family:var(--disp);text-transform:uppercase;font-weight:600;letter-spacing:.04em;font-size:14px;color:var(--mut);white-space:nowrap;min-width:0}
.seg button.sel{background:var(--acc);color:#12151A}

.dcard{border-color:rgba(229,72,77,.4)}
.dcard h3{color:var(--bad)}
.dcard li,.lcard li{margin:7px 0 7px 18px;font-size:14.5px;color:#c6cdd6}
.lcard h3{color:var(--acc)}
h2.sect{font-family:var(--disp);text-transform:uppercase;font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--mut);margin:22px 0 4px}

#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:60;background:var(--surface2);border:1px solid var(--acc-dim);color:var(--acc);font-family:var(--disp);font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:6px 14px;border-radius:99px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#sheet{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:none;justify-content:center;z-index:40;pointer-events:none;transform:translateZ(0);will-change:transform}
#sheet.show{display:flex}
.sheet-in{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--surface2);border:1px solid var(--acc-dim);border-radius:16px;padding:12px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tnum{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.tlab{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.tbtn{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;color:var(--text);background:var(--surface)}

.iso{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;margin:10px 0}
.iso .tnum{font-size:52px;display:block;min-width:0}
.isodots{display:flex;gap:8px;justify-content:center;margin:10px 0}
.isodots i{width:12px;height:12px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.isodots i.on{background:var(--acc);border-color:var(--acc)}
.isobtn{margin-top:6px;padding:12px 26px;border-radius:99px;background:var(--acc);color:#12151A;font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.06em;font-size:15px}
.isobtn[disabled]{opacity:.5}
.isophase{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--mut);margin-bottom:4px}

nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,21,26,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateZ(0);will-change:transform;-webkit-backface-visibility:hidden}
.nav-in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:560px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 7px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.03em;font-size:10px;font-weight:600;color:var(--mut);border-top:2px solid transparent;overflow:hidden;white-space:nowrap}
nav button svg{width:19px;height:19px;flex:none}
nav button.sel{color:var(--acc);border-top-color:var(--acc)}
/* Con 7 pestañas las etiquetas no caben a 10px en pantallas de 375-390 px. */
.nav-in.n7 button{font-size:9px;letter-spacing:.005em;padding-left:0;padding-right:0}
.nav-in.n7 button svg{width:18px;height:18px}

.backlink{display:inline-block;margin:10px 0 0;color:var(--mut);font-size:14px;text-decoration:underline;text-underline-offset:3px}
table.mini{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.mini td{padding:7px 6px;border-top:1px solid var(--line);color:#c6cdd6;vertical-align:top}
table.mini td:first-child{font-family:var(--disp);text-transform:uppercase;font-weight:600;color:var(--mut);white-space:nowrap}
table.mini.labs td{padding:7px 4px}
table.mini.labs td:first-child{white-space:normal;line-height:1.2}
table.mini.labs td:nth-child(2){white-space:nowrap}

/* ---- pestaña Rutina: la sesión sola, en vivo ----
   Mismos datos que en Hoy (comparten kv), pero sin el parte del día delante:
   barra pegada arriba con la serie en curso y ejercicios terminados plegados. */
/* Macros del día: una sola fila de 3 columnas bajo "Tu cuerpo hoy". */
.macrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macg{min-width:0}
.macl{font-family:var(--disp);text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macb{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:6px 0 5px}
.macb i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width .3s}
.macb i.ok{background:var(--ok)}
.macb i.over{background:var(--bad)}
.macv{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.macv span{color:var(--mut);font-size:11px}
.bedv{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;margin-top:5px}
.bedm{font:400 10px var(--mono);color:var(--mut);margin-top:3px}
.bedv.ok{color:var(--ok)}
.bedv.bad{color:var(--bad)}
.eatrow{margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
.eatl{font-family:var(--disp);text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--mut)}
.eatv{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.eatv span{color:var(--mut);font-size:11px}
.macwarn{margin-top:9px;font-size:12px;color:var(--warn);line-height:1.4;border-top:1px solid var(--line);padding-top:8px}
.foldh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;color:inherit;cursor:pointer}
.foldr{display:flex;align-items:baseline;gap:9px;flex:none}
.foldh .chev{color:var(--mut);font-size:12px}
.sesr{display:flex;align-items:baseline;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line)}
.sesr:last-child{border-bottom:0}

<script>

/* ---------- helpers ---------- */
function S(k,d){try{var v=localStorage.getItem("hs:"+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function W(k,v){try{localStorage.setItem("hs:"+k,JSON.stringify(v))}catch(e){}cloudPush(k,v)}
function yt(q){return "https://www.youtube.com/results?search_query="+encodeURIComponent(q)}
function pad(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
/* Vibración: Android tiene navigator.vibrate. iOS no expone API de vibración a
   webapps; el sucedáneo es el tick háptico de los <input switch> nativos vía
   click de su <label> (iOS 17.4+), que puede requerir gesto de usuario. */
var _hapL=null;
function haptic(n){
  try{
    if(navigator.vibrate){navigator.vibrate(n>1?[150,80,150]:[60]);return}
    if(!_hapL){
      _hapL=document.createElement("label");
      _hapL.style.cssText="position:fixed;left:-9999px;top:0";
      _hapL.setAttribute("aria-hidden","true");
      var sw=document.createElement("input");
      sw.type="checkbox";sw.setAttribute("switch","");sw.tabIndex=-1;
      _hapL.appendChild(sw);
      document.body.appendChild(_hapL);
    }
    (n>1?[0,160,320]:[0]).forEach(function(t){setTimeout(function(){try{_hapL.click()}catch(e){}},t)});
  }catch(e){}
}

/* Notificación local al terminar un temporizador: el canal que en iOS vibra y
   suena a nivel de sistema (requiere permiso; se pide en el primer descanso,
   dentro del gesto del usuario). */
function notifyEnd(msg){
  try{
    if(!("Notification" in window)||Notification.permission!=="granted")return;
    if(!navigator.serviceWorker)return;
    navigator.serviceWorker.ready.then(function(reg){
      var tg="fitmet-timer-"+Date.now();
      reg.getNotifications().then(function(ns){ns.forEach(function(x){if((x.tag||"").indexOf("fitmet-timer")===0)x.close()})});
      reg.showNotification("Fitmet",{body:msg,tag:tg,silent:false});
      setTimeout(function(){
        reg.getNotifications({tag:tg}).then(function(ns){ns.forEach(function(x){x.close()})});
      },5000);
    });
  }catch(e){}
}
function askNotif(){
  try{
    if(("Notification" in window)&&Notification.permission==="default")
      Notification.requestPermission().then(function(p){if(p==="granted")ensurePushSub()});
    else ensurePushSub();
  }catch(e){}
}

/* Web Push real (iOS 16.4+, PWA instalada): el servidor avisa al vencer el
   descanso aunque la app esté congelada. Edge Function: push-timer. */
var VAPID_PUB="BI-6PYH7flRk43qwRagKC5mx01aKtkDE58M35ihgW2jbRuHuYYv1wFTd_xuk-_mA6GHh-HSTe9ZOQRNyGZr37lQ";
var PUSHSUB=null;
function b64uToU8(s){var p="=".repeat((4-s.length%4)%4);var b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));var a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function ensurePushSub(){
  try{
    if(!("Notification" in window)||Notification.permission!=="granted")return;
    if(!navigator.serviceWorker||!("PushManager" in window))return;
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(s){
        return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(VAPID_PUB)});
      });
    }).then(function(s){
      PUSHSUB=s;
      if(s&&s.endpoint)W("pushsub",{endpoint:s.endpoint});
    },function(){});
  }catch(e){}
}
function pushMeta(endAt,msg){
  try{caches.open("fitmet-push").then(function(c){c.put("/push-meta",new Response(JSON.stringify({endAt:endAt,msg:msg})))})}catch(e){}
}
function schedulePush(sec,msg){
  try{
    if(!PUSHSUB)return;
    pushMeta(Date.now()+sec*1000,msg);
    fetch(SB_URL+"/functions/v1/push-timer",{method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY},
      body:JSON.stringify({endpoint:PUSHSUB.endpoint,delay_s:sec})}).catch(function(){});
  }catch(e){}
}

function beep(){try{var A=window.AudioContext||window.webkitAudioContext;var ctx=beep.ctx||(beep.ctx=new A());
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  [0,0.22].forEach(function(t){var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
  g.gain.setValueAtTime(.25,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.18);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.2)});
  haptic(3);}catch(e){}}

/* ---------- cloud (Supabase) ---------- */
var SB_URL="https://rinjfomkmxvnyqpeftxa.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpbmpmb21rbXh2bnlxcGVmdHhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMzUzNTIsImV4cCI6MjA5ODgxMTM1Mn0.GGR10McZ2hxHSEFxFS3zE1yzh6YteQIEbM3VyaFcEhA";  // clave anon: publica por diseno, RLS protege los datos / anon key: public by design, RLS protects the data
var sb=null,sbUser=null,sbProfile=null;
try{if(SB_URL&&SB_KEY&&window.supabase)sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){}
function cloudOn(){return !!(sb&&sbUser)}
function cloudPush(k,v){
  if(!cloudOn()||k==="__dirty")return;
  sb.from("kv_state").upsert({user_id:sbUser.id,k:k,v:v,updated_at:new Date().toISOString()})
    .then(function(r){if(r.error)markDirty(k)},function(){markDirty(k)});
}
function markDirty(k){
  var d=S("__dirty",[]);
  if(d.indexOf(k)<0){d.push(k);try{localStorage.setItem("hs:__dirty",JSON.stringify(d))}catch(e){}}
}
function flushDirty(){
  if(!cloudOn())return;
  var d=S("__dirty",[]);if(!d.length)return;
  try{localStorage.setItem("hs:__dirty","[]")}catch(e){}
  d.forEach(function(k){cloudPush(k,S(k,null))});
}
/* Cuándo se bajó por última vez la configuración de la nube. Sin esto, pullAll
   solo corría al iniciar sesión: si el plan o la rutina cambiaban en el backend,
   el móvil seguía con la copia vieja hasta cerrar sesión. Pasó con las horas de
   comida y con el plan de carrera. */
var ULTPULL=0;
function pullAll(){
  ULTPULL=Date.now();
  return sb.from("kv_state").select("k,v").then(function(r){
    if(r.error||!r.data)return;
    r.data.forEach(function(row){try{localStorage.setItem("hs:"+row.k,JSON.stringify(row.v))}catch(e){}});
    LANG=S("lang",LANG);
    state.viaje=S("viajeMode",state.viaje);
  });
}
function loadProfile(){
  return sb.from("profiles").select("display_name").eq("id",sbUser.id).maybeSingle()
    .then(function(r){sbProfile=(r&&r.data)||null},function(){});
}
if(sb){
  sb.auth.onAuthStateChange(function(ev,session){
    var was=!!sbUser;sbUser=session?session.user:null;
    if(sbUser&&!was){Promise.all([pullAll(),loadProfile()]).then(function(){flushDirty();flushLogs();render()});}
    else if(!sbUser&&was){sbProfile=null;state.tab="hoy";LOGS.data=null;METRICS.data=null;GACT.data=null;LASTUP=null;
      try{localStorage.removeItem("hs:clinical");localStorage.removeItem("hs:routine")}catch(e){}render();}
  });
  window.addEventListener("online",function(){flushDirty();flushLogs()});
}
function doAuth(kind){
  var em=((document.getElementById("f-email")||{}).value||"").trim();
  var pw=(document.getElementById("f-pass")||{}).value||"";
  var nm=((document.getElementById("f-name")||{}).value||"").trim();
  if(!em||!pw){authMsg(false,u("email")+" + "+u("pass"));return}
  if(kind==="login"){
    sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
      if(r.error)authMsg(false,r.error.message);
      else state.tab="hoy";
    });
  }else{
    sb.auth.signUp({email:em,password:pw,options:{data:{display_name:nm||em.split("@")[0]}}}).then(function(r){
      if(r.error)authMsg(false,r.error.message);
      else if(r.data&&r.data.session)state.tab="hoy";
      else authMsg(true,u("confirmMail"));
    });
  }
}
function saveName(){
  var nm=((document.getElementById("f-name")||{}).value||"").trim();
  sb.from("profiles").upsert({id:sbUser.id,display_name:nm}).then(function(r){
    if(r.error)authMsg(false,r.error.message);
    else{sbProfile={display_name:nm};authMsg(true,u("saved"));renderHdr();}
  });
}
function authMsg(ok,msg){
  var e=document.getElementById("errmsg"),o=document.getElementById("okmsg");
  if(e){e.className="err"+(ok?"":" show");e.textContent=ok?"":msg}
  if(o){o.className="okmsg"+(ok?" show":"");o.textContent=ok?msg:""}
}

/* ---------- registro de sesiones (workout_logs) ---------- */
var LOGS={data:null,loading:false};
function loadLogs(){
  if(!cloudOn()||LOGS.loading)return;
  LOGS.loading=true;
  var since=new Date();since.setDate(since.getDate()-90);
  sb.from("workout_logs").select("day,session_id,title,entries,total_sets,est_volume,created_at,note")
    .gte("day",iso(since)).order("day",{ascending:true})
    .then(function(r){LOGS.loading=false;LOGS.data=r.data||[];render();},
          function(){LOGS.loading=false;LOGS.data=[];render();});
}
/* ---------- última actualización de datos (header del dashboard) ---------- */
var LASTUP=null,LASTUPloading=false;
function loadLastUp(){
  if(!cloudOn()||LASTUPloading)return;
  LASTUPloading=true;
  sb.from("daily_metrics").select("updated_at").order("updated_at",{ascending:false}).limit(1)
    .then(function(r){LASTUPloading=false;
      if(r.data&&r.data[0]&&r.data[0].updated_at!==LASTUP){LASTUP=r.data[0].updated_at;renderHdr();}},
      function(){LASTUPloading=false;});
}

/* ---------- últimas actividades Garmin ---------- */
var GACT={data:null,loading:false};
function loadGact(){
  if(!cloudOn()||GACT.loading)return;
  GACT.loading=true;
  sb.from("garmin_activities")
    .select("activity_id,start_time,type,distance_km,duration_min,pace,hr_avg,hr_max,calories,cadence,elevation_m,temp_c,apparent_c,raw")

/* ---------- métricas diarias (balance energético) ---------- */
var METRICS={data:null,loading:false};
function loadMetrics(){
  if(!cloudOn()||METRICS.loading)return;
  METRICS.loading=true;

  sb.from("daily_metrics").select("*").gte("day",iso(since)).order("day",{ascending:true})
    .then(function(r){METRICS.loading=false;METRICS.data=r.data||[];render();},
          function(){METRICS.loading=false;METRICS.data=[];render();});
}

/* Estimación de reps para precargar: rango "8-12" → el mayor (12);
   lista "15/15/12" → la lista tal cual; "15" → 15; sin números → vacío */
function estReps(rs){
  rs=String(rs||"");
  var nums=rs.split(/[^\d.]+/).filter(Boolean).map(Number).filter(function(n){return n>0});
  if(!nums.length)return "";
  if(/[-–]/.test(rs)&&nums.length===2)return String(Math.max(nums[0],nums[1]));
  if(nums.length===1)return String(nums[0]);
  return nums.join(",");
}
function repsMid(reps){
  var mm=/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?/.exec(String(reps));
  if(!mm)return 0;
  var a=parseFloat(mm[1].replace(",", ".")),b=mm[2]?parseFloat(mm[2].replace(",", ".")):null;
  return b?(a+b)/2:a;
}
function buildLog(sid){
  var s=getSession(sid),st=S(setsKey(sid),{}),entries=[],total=0,vol=0;
  orderedIdx(sid,s.items).forEach(function(i){
    var it=s.items[i];
    if(!it.sets)return;
    var NSb=nSets(sid,i,it);
    var arr=st[i]||[],c=0;for(var j=0;j<NSb;j++)if(arr[j])c++;
    if(!c)return;
    var w=parseFloat(String(S("w:"+sid+":"+i,"")).replace(",", "."));
    var rp=String(S("r:"+TODAY+":"+sid+":"+i,"")).trim();
    if(!rp)rp=estReps(T(it.reps));   // misma estimación que se precarga en pantalla
    var tot=0;
    if(rp){
      var nums=rp.split(/[^\d.]+/).filter(Boolean).map(Number).filter(function(n){return n>0});
      if(nums.length===1)tot=nums[0]*c;
      else if(nums.length>1){
        var take=nums.slice(0,c);
        while(take.length<c)take.push(nums[nums.length-1]);
        tot=take.reduce(function(a,b){return a+b},0);
      }
    }
    if(!tot){var rm=repsMid(T(it.reps));tot=rm>0?rm*c:0}
    total+=c;
    if(w>0&&tot>0)vol+=tot*w;
    entries.push({n:T(it.n),m:muscleOf(sid,i,it),sets:c,reps:rp||null,target:nSets(sid,i,it)+"×"+T(it.reps),weight:w>0?w:null});
  });
  if(!entries.length)return null;
  var nt=String(S("note:"+TODAY+":"+sid,"")).trim();
  return {user_id:sbUser?sbUser.id:null,day:TODAY,session_id:sid,title:T(s.title),
          entries:entries,total_sets:total,est_volume:Math.round(vol),note:nt||null};
}
function saveLog(row,sid){
  sb.from("workout_logs").insert(row).then(
    function(r){
      if(r.error){queueLog(row)}
      W("savedlog:"+TODAY+":"+sid,true);LOGS.data=null;render(true);
    },
    function(){queueLog(row);W("savedlog:"+TODAY+":"+sid,true);render(true);});
}
function queueLog(row){var q=S("pendingLogs",[]);q.push(row);W("pendingLogs",q)}
function flushLogs(){
  if(!cloudOn())return;
  var q=S("pendingLogs",[]);if(!q.length)return;
  W("pendingLogs",[]);
  q.forEach(function(row){
    row.user_id=sbUser.id;
    sb.from("workout_logs").insert(row).then(function(r){if(r.error)queueLog(row)},function(){queueLog(row)});
  });
}

        "V-handle, knees slightly bent. Pull to your abdomen with elbows tucked, squeeze the shoulder blades at the end, return under control without rounding. Pulling is the friendliest block for your shoulder — that's why it gets one more set than pressing.")},
  {n:B("Tríceps en polea (cuerda)","Triceps rope pushdown"),sets:3,reps:"10-15",chips:[B("Codos fijos","Elbows pinned")],yt:"triceps rope pushdown technique",
   how:B("De pie, codos pegados a los costados: son la bisagra y no se mueven. Extiende hacia abajo separando la cuerda al final. Todo tríceps por encima de la cabeza y los fondos siguen fuera.",
        "Standing, elbows pinned to your sides: they're the hinge and don't move. Extend down, splitting the rope at the bottom. All overhead triceps work and dips remain off the table.")},
  {n:B("Curl con barra","Barbell curl"),sets:3,reps:"8-12",chips:[B("Libre","Unrestricted")],yt:"barbell curl technique",
   how:B("Curl clásico de pie, sin balanceo. Sin restricciones por el hombro: aquí puedes ir a por ello.",
        "Classic standing curl, no swinging. No shoulder restrictions here: you can go after it.")}
]},

lowB:{title:B("Lower B · Volumen","Lower B · Volume"),sub:B("Glúteo, unilateral y máquinas","Glutes, unilateral and machines"),load:"hard",type:"gym",items:[
  LOWWARM,
  {n:B("Hip thrust con barra","Barbell hip thrust"),sets:3,reps:"8-12",chips:[B("Pad en cadera","Pad on hips"),B("Glúteo","Glutes")],yt:"barbell hip thrust technique",
   how:B("Espalda alta apoyada en el banco, pad en la cadera. Sube con glúteo hasta la extensión completa, sin arquear la lumbar, barbilla ligeramente recogida. Pausa de 1 s arriba. El glúteo es el motor de la zancada al correr y no se entrena solo con sentadilla.",
        "Upper back on the bench, pad on the hips. Drive up with the glutes to full extension without arching the lower back, chin slightly tucked. 1 s pause at the top. The glutes are the engine of your running stride and squats alone don't train them.")},
  {n:B("Zancadas caminando con mancuernas","Walking lunges, dumbbells"),sets:3,reps:B("10 /pierna","10 /leg"),chips:[B("Unilateral","Unilateral")],yt:"dumbbell walking lunge technique",
   how:B("Mancuernas colgando a los lados, paso largo, rodilla trasera casi al suelo, torso erguido. Si no tienes recorrido, hazlas alternas en el sitio. Variante de zancada distinta a la búlgara del martes para que la pierna reciba dos estímulos parecidos pero no idénticos.",
        "Dumbbells hanging at your sides, long stride, rear knee nearly touching the floor, torso upright. If you're short on space, do them alternating in place. A different lunge pattern from Tuesday's Bulgarian so the legs get two similar but not identical stimuli.")},
  {n:B("Extensión de cuádriceps","Leg extension"),sets:3,reps:"12-15",chips:[B("Cuádriceps","Quads")],yt:"leg extension technique",
   how:B("Pausa de 1 s arriba con la rodilla extendida y bajada controlada. Aísla el cuádriceps sin carga axial ni participación del hombro, así que puedes llevarlo cerca del fallo sin coste de recuperación para el resto de la semana.",
        "1 s pause at the top with the knee extended, controlled lowering. Isolates the quads with no axial load and no shoulder involvement, so you can take it close to failure without a recovery cost for the rest of the week.")},
  {n:B("Curl femoral en máquina","Machine leg curl"),sets:3,reps:"12-15",chips:[B("Isquios","Hamstrings")],yt:"lying leg curl technique",
   how:B("Mismo ejercicio que el martes pero en rango alto de repeticiones. Isquios fuertes son la mejor protección que tienes para la rodilla en la tirada larga.",
        "Same exercise as Tuesday but in a high rep range. Strong hamstrings are the best knee protection you have on the long run.")},
  {n:B("Dead bug","Dead bug"),sets:2,reps:B("10 /lado","10 /side"),chips:["Core"],yt:"dead bug exercise technique",
   how:B("Tumbado boca arriba, extiende el brazo y la pierna contrarios a la vez, lumbar pegada al suelo. El brazo sube vertical sin soportar peso: sustituye a la plancha, que en tu caso ha irritado el hombro al cargarlo sobre el antebrazo.",
        "Lying on your back, extend the opposite arm and leg together, lower back pinned to the floor. The arm rises straight up with no weight-bearing: it replaces the plank, which has irritated your shoulder by loading it through the forearm.")}
]},

carga:{title:B("Carga · pierna + upper","Load day · legs + upper"),sub:B("El día fuerte · alterna pierna y torso · sin tope de tiempo","The heavy day · alternate legs and torso · no time cap"),load:"long",type:"gym",items:[
  {n:B("Calentamiento","Warm-up"),sets:0,reps:"5-10 min",chips:[],yt:"",
   how:B("Movilidad de cadera y tobillo, y series de aproximación de la sentadilla. En el día de carga el calentamiento no es opcional.",
        "Hip and ankle mobility, plus ramp-up sets on the squat. On the heavy day the warm-up is not optional.")},
  {n:B("Sentadilla con safety squat bar","Safety squat bar squat"),m:"legs",sets:4,reps:"5-6",chips:[B("Lo primero","Do this first")],yt:"safety squat bar squat technique",
   how:B("La SSB evita la posición de rack que carga el hombro. Va la primera, con las piernas frescas.",
        "The SSB avoids the rack position that loads the shoulder. It goes first, on fresh legs.")},
  {n:B("Floor press con mancuernas","Dumbbell floor press"),m:"chest",sets:4,reps:"6-10",chips:[B("Tu empuje","Your press")],yt:"dumbbell floor press",
   how:B("Alterna con la sentadilla para ganar tiempo: mientras descansan las piernas, empuja. El suelo limita el rango y protege el hombro. Desde el 3-ago la banca con barra está autorizada a muy poco peso, con escápulas juntas y sin hiperlordosis.",
        "Superset it with the squat to save time: press while your legs recover. The floor limits the range and protects the shoulder. Since 3 Aug barbell bench is cleared at very light weight, shoulder blades squeezed, no hyperlordosis.")},
  {n:B("Peso muerto rumano","Romanian deadlift"),m:"legs",sets:3,reps:"6-8",chips:[],yt:"romanian deadlift technique",
   how:B("Bisagra de cadera, espalda neutra. Es lo que protege el isquiotibial en la carrera.",
        "Hip hinge, neutral spine. This is what protects the hamstring when you run.")},
  {n:B("Jalón al pecho, agarre neutro estrecho","Neutral-grip lat pulldown"),m:"back",sets:3,reps:"8-12",chips:[],yt:"neutral grip lat pulldown",
   how:B("Agarre neutro, palmas enfrentadas: el más seguro para tu hombro. Alterna con el peso muerto rumano.",
        "Neutral grip, palms facing: the safest for your shoulder. Alternate it with the RDL.")},
  {n:B("Curl femoral en máquina","Leg curl"),m:"legs",sets:3,reps:"10-12",chips:[],yt:"lying leg curl",
   how:B("Isquios aislados. Con tres carreras a la semana, este es el seguro contra tirones.",
        "Isolated hamstrings. With three runs a week, this is your insurance against strains.")},
  {n:B("Face pull en polea","Cable face pull"),m:"cuff",sets:3,reps:"15-20",chips:[B("Manguito","Cuff")],yt:"cable face pull technique",
   how:B("A la altura del pecho, nunca por encima de la cara. Abre el espacio subacromial, que es lo que Ana señaló junto al remo.",
        "At chest height, never above your face. It opens the subacromial space, which is what Dr. Ana singled out alongside rows.")}
]},
upB:{title:"Upper B",sub:B("Floor press + tracción vertical","Floor press + vertical pulling"),load:"soft",type:"gym",items:[
  WARMUP,
  {n:B("Floor press con mancuernas","Dumbbell floor press"),sets:4,reps:"6-10",chips:[B("Agarre neutro","Neutral grip"),B("Tu press progresable","Your progressable press")],yt:"dumbbell floor press neutral grip",
   how:B("Tumbado en el suelo, rodillas flexionadas, palmas enfrentadas, codos pegados. Baja hasta que los tríceps tocan el suelo y ahí paras (pausa de 1 s). El suelo corta el recorrido justo donde empieza la zona de riesgo — por eso ESTE es el press que sí puedes cargar progresivamente mientras la banca sigue vetada. Aquí es donde recuperas masa y dureza de pecho: aplica la progresión sin miedo, el rango protegido lo permite. Entra y sal de la posición con el truco de las rodillas. Cuando el equipo médico autorice, la vuelta será: floor press → press plano con mancuernas → banca con barra.",
        "Lying on the floor, knees bent, palms facing, elbows tucked. Lower until the triceps touch the floor and stop there (1 s pause). The floor cuts the range right where the risk zone starts — which is why THIS is the press you can load progressively while the bench stays off-limits. This is where you rebuild chest mass and density: apply the progression without fear, the protected range allows it. Get in and out with the knee-kick trick. When your medical team clears you, the way back runs: floor press → flat dumbbell press → barbell bench.")},
  {n:B("Jalón al pecho, agarre neutro estrecho","Lat pulldown, close neutral grip"),sets:3,reps:"8-12",chips:[B("Agarre neutro","Neutral grip"),B("Tracción","Pulling")],yt:"neutral grip lat pulldown",
   how:B("Maneral de asas paralelas, separación de hombros o menos. Tira hacia la parte alta del pecho llevando los codos abajo y atrás, pecho alto, sin balanceo. El brazo arriba está en TRACCIÓN: descomprime el hombro, y por eso esto sí y el press militar no. Si molesta en el estiramiento superior, acorta el rango. Nada de dead hang, ni con los pies apoyados.",
        "Parallel-handle attachment, shoulder width or narrower. Pull to the upper chest driving the elbows down and back, chest up, no swinging. The arm overhead is under TRACTION: it decompresses the shoulder, which is why this is allowed and overhead press is not. If the top stretch bothers you, shorten the range. No dead hangs, not even with feet supported.")},
  {n:B("Remo con mancuerna apoyado en banco","One-arm dumbbell row on bench"),sets:3,reps:B("8-12 /lado","8-12 /side"),chips:[B("Codos pegados","Elbows tucked")],yt:"one arm dumbbell row bench",
   how:B("Rodilla y mano del mismo lado en el banco, espalda paralela al suelo. Rema llevando el codo pegado al costado hacia la cadera, no hacia afuera en cruz. El apoyo en el banco estabiliza el tronco y protege el hombro que trabaja.",
        "Same-side knee and hand on the bench, back parallel to the floor. Row the elbow tight along your side toward the hip, not flared out. The bench support stabilizes the torso and protects the working shoulder.")},
  {n:B("Face pull en polea (altura pecho)","Cable face pull (chest height)"),sets:3,reps:"15-20",chips:[B("Salud de manguito","Cuff health"),B("Ligero","Light")],yt:"cable face pull technique",
   how:B("Polea a la altura del pecho (no de la cara), cuerda. Tira hacia ti separando las manos al final y rotando hacia afuera, escápulas juntas, cuello relajado, retorno lento. Peso ligero SIEMPRE: esto es salud de manguito y postura, no un ejercicio de fuerza. Es el antídoto directo de todo el empuje de la semana. Si el hombro avisa por encima de 1-2/10, baja el anclaje.",
        "Cable at chest height (not face height), rope attachment. Pull toward you spreading the hands at the end with external rotation, shoulder blades squeezed, neck relaxed, slow return. ALWAYS light: this is cuff and posture health, not a strength lift. It's the direct antidote to all the pressing in your week. If the shoulder complains above 1-2/10, lower the anchor.")},
  {n:B("Curl martillo","Hammer curl"),sets:3,reps:"8-12",chips:[B("Agarre neutro","Neutral grip")],yt:"hammer curl technique",
   how:B("Curl con palmas enfrentadas. Sin restricciones por el hombro.",
        "Curl with palms facing each other. No shoulder restrictions.")},
  {n:B("Farmer carry con mancuernas","Dumbbell farmer carry"),sets:3,reps:"30-40 m",chips:[B("Joya para tu hombro","A gem for your shoulder")],yt:"farmer carry technique",
   how:B("Mancuernas pesadas colgando a los lados, camina erguido con las escápulas 'metidas en los bolsillos'. Trabajo isométrico de trapecio y manguito sin ningún gesto de riesgo: de lo mejor que puedes hacer por ese hombro. Si no hay espacio, 3×30-40 s de pie sujetando.",
        "Heavy dumbbells hanging at your sides, walk tall with the shoulder blades 'tucked into your back pockets'. Isometric trap and cuff work with zero risky movement: among the best things you can do for that shoulder. No space? 3×30-40 s standing holds.")},
  CUFFREF
]},

activo:{title:B("Descanso activo","Active recovery"),sub:B("Isométricos + movilidad · 15-20 min en casa","Isometrics + mobility · 15-20 min at home"),type:"gym",items:[
  {n:B("Isométrico rotación externa en pared","Wall external-rotation isometric"),sets:5,reps:"30-45 s",chips:[B("50-60% esfuerzo","50-60% effort")],yt:"isometric shoulder external rotation wall",link:"manguito",
   how:B("Codo a 90° pegado al costado, dorso de la muñeca contra la pared o el marco de la puerta. Empuja como para rotar el brazo hacia afuera: nada se mueve. Esfuerzo claramente submáximo. Usa el cronómetro guiado de la pestaña Manguito.",
        "Elbow at 90° pinned to your side, back of the wrist against the wall or door frame. Push as if rotating the arm outward: nothing moves. Clearly submaximal effort. Use the guided timer in the Cuff tab.")},
  {n:B("Codman + movilidad torácica + cápsula posterior","Codman + thoracic mobility + posterior capsule"),sets:1,reps:"8 min",chips:[B("Sin dolor","Pain-free")],yt:"sleeper stretch posterior capsule",
   how:B("Pendulares suaves, rotaciones torácicas sentado, gato-camello. Y añade el sleeper stretch SUAVE (3×30 s): tumbado sobre el lado derecho, hombro y codo a 90°, empuja la muñeca hacia el suelo con la otra mano hasta notar tensión, NUNCA dolor. Es mantenimiento de por vida, como el manguito.",
        "Gentle pendulums, seated thoracic rotations, cat-camel. And add the GENTLE sleeper stretch (3×30 s): lying on your right side, shoulder and elbow at 90°, push the wrist toward the floor with the other hand until you feel tension, NEVER pain. Lifelong maintenance, like the cuff work.")},
  {n:B("Movilidad de cadera y tobillo","Hip and ankle mobility"),sets:1,reps:"5 min",chips:[],yt:"hip ankle mobility runners",
   how:B("90/90 de cadera, dorsiflexión de tobillo contra pared.",
        "90/90 hip work, ankle dorsiflexion against the wall.")}
]},
runEasy:{title:B("Rodaje suave","Easy run"),sub:B("Con Upper A antes · el que construye la base","With Upper A first · this is what builds the base"),load:"hard",type:"run",km:"5-7 km",items:[
  {n:B("Rodaje suave","Easy run"),m:"cardio",sets:0,reps:"30-35 min",chips:[B("Conversacional","Conversational")],yt:"",
   how:B("Ritmo cómodo, poder decir frases enteras. Aquí NO se busca ritmo: se busca tiempo en pie con el pulso bajo, que es lo que construye la base aeróbica. Con calor manda el pulso, no el reloj.",
        "Comfortable pace, able to speak full sentences. This is NOT about pace: it's time on feet at low HR, which is what builds the aerobic base. In heat, HR rules, not the watch.")},
  {n:B("Rectas","Strides"),m:"cardio",sets:6,reps:"20 s",chips:[B("Sin coste","No cost")],yt:"running strides technique",
   how:B("6 aceleraciones de 20 segundos al final, rápidas y sueltas, parando hasta recuperar del todo. Mejoran técnica y economía sin añadir fatiga, porque son demasiado cortas para acumular lactato.",
        "6 accelerations of 20 seconds at the end, fast and relaxed, with full recovery between. They improve form and economy without adding fatigue — too short to build up lactate.")}
]},
run1:{title:B("Calidad","Quality"),sub:B("El día que se corre rápido · 45-55 min","The day you run fast · 45-55 min"),load:"hard",type:"run",km:"6-9 km",items:[
  {n:B("Calentamiento","Warm-up"),m:"cardio",sets:0,reps:"12-15 min",chips:[],yt:"",
   how:B("Trote a 7:45-8:15 subiendo poco a poco, y 4 rectas de 20 s al final para despertar la pierna. No lo recortes: entrar en series con la pierna fría es como se rompen los gemelos y el sóleo, y tú vienes de meses sin correr rápido.",
        "Jog at 7:45-8:15 easing in, plus 4 strides of 20 s at the end to wake the legs up. Don't cut it: cold legs into intervals is how calves and soleus tear, and you're coming back from months without fast running.")},
  {n:B("Tus ritmos","Your paces"),m:"cardio",sets:0,reps:"referencia",chips:[B("Consulta","Reference")],yt:"",
   how:B("Las series de hoy están en la tarjeta de arriba. Esto es solo a qué velocidad se corren:\n\n· Series cortas, de 1 a 3 minutos → 5:50-6:10 min/km\n· Bloques de umbral, de 8 a 10 minutos → 6:20-6:40 min/km\n· Recuperación entre repeticiones → andando o trote muy suave, sin mirar el reloj\n· Ritmo objetivo de la carrera → se fija con el test de 5 km del 4 de octubre\n\nRegla: si la última repetición sale más lenta que la primera, empezaste demasiado rápido. Mejor terminar pudiendo hacer una más que reventar en la penúltima.",
        "Today's reps are in the card above. This is just how fast to run them:\n\n· Short reps, 1 to 3 minutes → 5:50-6:10 min/km\n· Threshold blocks, 8 to 10 minutes → 6:20-6:40 min/km\n· Recovery between reps → walking or very easy jog, don't watch the clock\n· Race target pace → set by the 5 km test on 4 October\n\nRule: if the last rep is slower than the first, you started too fast. Better to finish able to do one more than to blow up on the second-to-last.")},
  {n:B("Enfriamiento","Cool-down"),m:"cardio",sets:0,reps:"10 min",chips:[],yt:"",
   how:B("Trote muy suave hasta que el pulso baje de 120. Y marca lap al empezar y terminar cada repetición: con eso puedo ver si mantuviste el ritmo en todas y —lo más útil— cuánto te baja el pulso en cada recuperación, que es de los mejores indicadores de que estás cogiendo forma.",
        "Very easy jog until HR drops below 120. And press lap at the start and end of each rep: that lets me see whether you held the pace across all of them and — most useful — how far your HR drops in each recovery, one of the best signs that fitness is coming.")}
]},

runLong:{title:B("Tirada larga","Long run"),sub:B("La sesión que más pesa · progresiva, nunca plana","The session that matters most · progressive, never flat"),load:"long",type:"run",km:"10-14 km",items:[
  {n:B("Tirada progresiva","Progressive long run"),m:"cardio",sets:0,reps:"50-75 min",chips:[B("Empieza lento","Start slow")],yt:"",
   how:B("Divídela en tres tercios. Primero a 8:00-8:15, más lento de lo que te apetece. Segundo a 7:40-8:00. Último a 6:50-7:10, y solo si el ritmo anterior te resulta fácil.\n\nEl error número uno es empezar a tu ritmo cómodo: entonces no queda margen para progresar y el último tercio se convierte en agonía. Debes terminar pensando «podría haber seguido un poco más».\n\nSi la haces fuera, truco: haz el último tercio de vuelta a casa, que acelerar cuesta mucho menos acercándose al final que alejándose.",
        "Split it in thirds. First at 8:00-8:15, slower than you feel like. Second at 7:40-8:00. Last at 6:50-7:10, and only if the previous pace feels easy.\n\nThe number one mistake is starting at your comfortable pace: then there's no room to progress and the last third becomes a grind. You should finish thinking «I could have kept going a bit».\n\nTrick: run the last third heading home. Speeding up is far easier when you're closing in than when you're heading away.")},
  {n:B("En cinta","On the treadmill"),m:"cardio",sets:0,reps:"1 % de inclinación",chips:[B("Importante","Important")],yt:"",
   how:B("Hacerla en cinta con una peli es perfectamente válido y es lo que te funciona: la tirada que haces vale infinitamente más que la que te saltas por aburrimiento.\n\nYa la pones al 1 % por defecto, que es exactamente lo correcto: a 0 % la cinta es más fácil que la calle —no hay resistencia del aire y la banda te ayuda a llevar la pierna atrás— y entrenarías a menos esfuerzo del que marca el reloj. Con tu 1 %, tus ritmos de cinta SÍ son comparables con los de asfalto, y eso vale para la proyección de la carrera.\n\nY reserva para la calle las sesiones del bloque final (semanas 10 a 15): el ritmo objetivo hay que aprenderlo con viento, cuestas y el suelo que vas a pisar el día de la carrera.",
        "Doing it on the treadmill with a film is perfectly valid and it's what works for you: the long run you actually do is worth infinitely more than the one you skip out of boredom.\n\nYou already run at 1 % by default, which is exactly right: at 0 % the treadmill is easier than the road — no air resistance and the belt helps pull your leg back — and you'd be training at less effort than the watch shows. With your 1 %, treadmill paces ARE comparable to tarmac, and that matters for the race projection.\n\nAnd save the road for the final block (weeks 10-15): target pace has to be learned with wind, camber and the surface you'll actually race on.")},
  {n:B("Avituallamiento","Fuelling"),m:"cardio",sets:0,reps:"a partir de 60 min",chips:[],yt:"",
   how:B("Por debajo de una hora no hace falta nada más que agua. A partir de ahí, 30-60 g de carbohidratos por hora — un gel o un plátano — y beber aunque no tengas sed. En agosto y con tu déficit, salir en ayunas a una tirada de más de una hora es la forma más rápida de terminarla arrastrándote y de comerte el resto del día con hambre.",
        "Under an hour, water is enough. Beyond that, 30-60 g of carbs per hour — a gel or a banana — and drink even if you're not thirsty. In August and on your deficit, heading out fasted for a run over an hour is the fastest way to finish it crawling and to spend the rest of the day starving.")}
]},

/* Grupos musculares: etiquetas bilingües + mapa por sesión/índice para la rutina integrada.
   Las rutinas cargadas desde la nube (clave kv "routine") traen `m` en cada ejercicio. */
var MUSC={chest:B("Pecho","Chest"),back:B("Espalda","Back"),shoulders:B("Hombros","Shoulders"),
  biceps:B("Bíceps","Biceps"),triceps:B("Tríceps","Triceps"),legs:B("Pierna","Legs"),
  core:B("Core","Core"),cuff:B("Manguito","Cuff"),cardio:B("Cardio","Cardio")};
var MGROUPS={
  lowA:[null,"legs","legs","legs","legs","core"],
  upA:[null,"chest","back","chest","triceps","biceps","cuff"],
  lowB:[null,"legs","legs","legs","legs","legs","core"],
  upB:[null,"chest","back","back","cuff","biceps","back","cuff"],
  activo:["cuff","core","core"],
  hotelA:["legs","chest","back","core","cuff"],
  hotelB:["legs","chest","back","core","cuff"],
  gomasA:["legs","chest","back","legs","legs","chest","core","cuff"],
  gomasB:["legs","chest","back","legs","legs","triceps","biceps","core"],
  /* manguito ya no está aquí: sus ejercicios llevan `m` propio desde
     el 3-ago-2026. MGROUPS mapea por ÍNDICE y se desalinea en cuanto
     se reordena una sesión — cada ejercicio debe traer su grupo. */
  manguito:[]};
/* Último recurso para el seguimiento por grupo muscular: deducirlo del nombre.
   Sin esto, una rutina nueva que no traiga `m` en sus ejercicios dejaría de
   contar series en Progreso. El ORDEN de las reglas importa: "curl femoral" es
   pierna y no bíceps, "leg press" es pierna y no pecho, y "face pull" es
   manguito antes que espalda. */
var MGUESS=[
  ["cuff",   /manguito|cuff|rotaci[oó]n (externa|interna)|(external|internal) rotation|face ?pull|pull.?apart|isom[eé]tric/i],
  ["legs",   /sentadilla|squat|peso muerto|deadlift|rumano|romanian|prensa|leg ?press|zancada|lunge|b[uú]lgara|bulgarian|femoral|leg ?curl|cu[aá]driceps|leg ?extension|hip ?thrust|gl[uú]teo|glute|gemelo|talones|calf|step.?up|hack/i],
  ["core",   /plancha|plank|dead ?bug|pallof|crunch|abdominal|russian|hollow|ab.?wheel|\bcore\b/i],
  ["cardio", /carrera|correr|rodaje|tirada|\brun\b|jog|bici|bike|cinta|treadmill|caminata|walk|hiit|sprint|el[ií]ptica|remo ergo/i],
  /* Tracción ANTES que pecho: "jalón al pecho" es espalda, y si pecho fuese
     primero se lo llevaría por la palabra "pecho". */
  ["back",   /\bremo\b|\brow\b|jal[oó]n|pulldown|dominada|pull.?up|pull.?over|encogimiento|shrug|farmer|dorsal|espalda|\blat\b/i],
  ["chest",  /press (inclinado|de banca|banca|de pecho|plano)|bench|floor ?press|pecho|apertura|\bfly/i],
  ["chest",  /cruces|\bpec\b|flexion|push.?up|contractora/i],
  ["shoulders",/elevaci[oó]n lateral|lateral raise|press militar|military|overhead press|deltoid|hombro/i],
  ["triceps",/tr[ií]ceps|\bfondo|\bdip|pushdown/i],
  ["biceps", /\bcurl\b|b[ií]ceps|martillo|hammer/i]
];
function guessMuscle(n){
  var s=String(n||"");if(!s)return null;
  for(var k=0;k<MGUESS.length;k++)if(MGUESS[k][1].test(s))return MGUESS[k][0];
  return null;
}
/* MGROUPS mapea grupo muscular POR ÍNDICE, y eso se desalinea en cuanto alguien
   inserta o mueve un ejercicio. Ha pasado tres veces: manguito, upB y las dos
   sesiones de gomas, donde un face pull insertado corrió todo el mapa una
   posición y el pecho se contaba como espalda. Un mapa descuadrado es PEOR que
   no tener mapa, así que si la longitud no cuadra con los ejercicios se ignora
   entero y manda el nombre. Lo definitivo es `m` en cada ejercicio. */
function mapaDe(sid){
  var m=MGROUPS[sid];if(!m)return null;
  var s=getSession(sid);
  return (s&&s.items&&s.items.length===m.length)?m:null;
}
function muscleOf(sid,i,it){
  return (it&&it.m)||((mapaDe(sid)||[])[i])||(it&&guessMuscle(T(it.n)))||null;
}

/* Rutina por usuario: si existe la clave kv "routine" (subida desde el backend),
   sustituye a la semana/sesiones integradas. Así cada perfil (p. ej. Lorena)
   tiene su propio plan sin tocar este código. */
function getRT(){return S("routine",null)}
/* Perfil solo-running. La app entera gira en torno a comida y peso, y hay quien
   solo quiere correr (Lorena Sofía, 19 años: le interesa el rendimiento, no la
   báscula). Un único punto de decisión en vez de ifs repartidos por el fichero:
   se activa con rt.mode === "run" en la rutina que trae kv_state. */
function runOnly(){var rt=getRT();return !!(rt&&rt.mode==="run")}
function getWeekBase(){
  /* Una rutina de kv_state con la semana incompleta tumbaba la app entera al
     indexar WK[idx]. Si no trae 7 días válidos, se usa la integrada. */
  var rt=getRT(),w=rt&&rt.week;
  if(!Array.isArray(w)||w.length!==7)return WEEK;
  for(var i=0;i<7;i++)if(!w[i]||!w[i].sid)return WEEK;
  return w;
}
function weekOrder(){
  var o=S("weekorder",null);
  if(!Array.isArray(o)||o.length!==7)return null;
  var seen={};
  for(var i=0;i<7;i++){var v=+o[i];if(!(v>=0&&v<7)||seen[v])return null;seen[v]=1}
  return o.map(Number);
}
function getWeek(){
  var base=getWeekBase(),o=weekOrder();
  if(!o)return base;
  return base.map(function(w,pos){
    var srcW=base[o[pos]],c={};
    for(var k in srcW)c[k]=srcW[k];
    c.d=w.d;c.name=w.name;return c;
  });
}
function getSession(sid){var rt=getRT();return (rt&&rt.sessions&&rt.sessions[sid])||EX[sid]}
/* Orden personalizado de ejercicios por sesión (kv "order:<sid>", sincronizado).
   Solo presentación: cada ejercicio conserva su índice interno, así pesos, series
   y grupo muscular viajan con él al moverlo. */
function orderOf(sid,n){
  var o=S("order:"+sid,null);
  if(!Array.isArray(o)||o.length!==n)return null;
  var seen={};
  for(var k=0;k<n;k++){var x=o[k];if(typeof x!=="number"||x<0||x>=n||seen[x])return null;seen[x]=1}
  return o;
}
function orderedIdx(sid,items){
  return orderOf(sid,items.length)||items.map(function(_,k){return k});
}
/* El semáforo del hombro y el marco de fase son del plan integrado (Marcos).
   Usuarios con rutina propia no ven nada del hombro salvo que su rutina lo pida. */
function shoulderUser(){var rt=getRT();return !rt||rt.shoulderCheck===true}

var state={tab:"hoy",sid:null,viaje:S("viajeMode","gomas"),pview:"train",dayOff:0,dayRange:1,rxSid:null,rxExp:{}};
/* El día se calculaba UNA vez, al cargar. Si la PWA se queda abierta y pasa la
   medianoche, TODAY se quedaba en el día anterior y TODO lo que se apuntara
   —horas de comida, series, pesos, journal— se guardaba con la fecha
   equivocada y sin aviso. Ahora se recalcula antes de cada render y al volver
   a primer plano, que es el caso real: el móvil pasa la noche bloqueado con la
   app abierta y se abre por la mañana. */
var todayIdx=(new Date().getDay()+6)%7;
var TODAY=iso(new Date());
function refrescaDia(){
  var hoy=iso(new Date());
  if(hoy===TODAY)return false;
  TODAY=hoy;
  todayIdx=(new Date().getDay()+6)%7;
  /* Si estaba mirando un día pasado, al cambiar la fecha ese offset ya no
     apunta a lo que él creía: se vuelve a hoy, que es lo menos sorprendente. */
  if(state&&state.dayOff)state.dayOff=0;
  return true;
}

/* ---------- renders ---------- */
function setsKey(sid){return "sets:"+TODAY+":"+sid}
function isDone(sid){
  var s=getSession(sid);if(!s)return false;
  if(s.type!=="gym")return !!S("done:"+TODAY+":"+sid,false);
  var st=S(setsKey(sid),{});
  var need=s.items.filter(function(it){return it.sets>0});
  if(!need.length)return false;
  return need.every(function(it){
    var idx=s.items.indexOf(it);var arr=st[idx]||[];var ns=nSets(sid,idx,it);
    var c=0;for(var j=0;j<ns;j++)if(arr[j])c++;
    return c>=ns;
  });
}

function nSets(sid,i,it){var v=S("nsets:"+sid+":"+i,null);return (v!=null&&+v>0)?+v:(it.sets||0)}
function exCard(sid,i,it,pos,tot){
  /* En las sesiones de carrera el detalle ES la sesión: el calentamiento, los
     ritmos y las repeticiones. Tenerlo detrás del botón "¿Cómo?" obliga a
     tocar cada ejercicio con el móvil en la mano y a punto de salir. En las de
     pesas sigue plegado: ahí el ejercicio se sabe y el texto es un recordatorio. */
  var esRun=(getSession(sid)||{}).type==="run";
  var st=S(setsKey(sid),{});var arr=st[i]||[];
  var NS=nSets(sid,i,it);
  var pills="";

function sessionView(sid,dia){
  var s=getSession(sid);var h="";
  if(!s)return "";
  if(s.type==="run"){
    var done=S("done:"+TODAY+":"+sid,false);
    h+='<div class="card runcard"><h3>'+esc(planTitulo(dia||selDay(),s)||T(s.title))+'</h3><p class="big">'+(s.km||"")+'</p><p class="note" style="margin-top:8px">'+esc(T(s.note)||"")+"</p>"+
       '<button class="donebtn'+(done?" on":"")+'" data-act="run-done" data-sid="'+sid+'">'+(done?u("done"):u("markDone"))+"</button></div>";
    /* Las sesiones de carrera solo enseñaban los km y el botón: sus bloques
       —objetivo, calentamiento, series, enfriamiento— nunca llegaban a pintarse
       porque esta rama no recorría los items. Era escribir el detalle para nadie. */
    /* Antes de entrenar el detalle es lo importante; después estorba. Cuando
       el reloj ya ha traído la sesión, las instrucciones se pliegan y manda el
       resultado, que es lo que uno mira al volver. */
    var rec=hechoCard(dia||selDay(),s);
    h+=rec;
    var cuerpoEx=(s.items||[]).map(function(it,i){return exCard(sid,i,it,i,(s.items||[]).length)}).join("");
    if(rec){
      var kf="fold:ses:"+sid,ab=S(kf,null);
      if(ab===null||ab===undefined)ab=false;
      h+='<div class="card" style="padding:0"><button class="foldh" data-act="fold" data-k="ses:'+sid+'" aria-expanded="'+(ab?"true":"false")+'">'+
         "<h3>"+T(B("Cómo era la sesión","What the session was"))+"</h3>"+
         '<span class="foldr"><span class="chev">'+(ab?"▾":"▸")+"</span></span></button></div>"+
         (ab?cuerpoEx:"");
    }else h+=cuerpoEx;
  }else if(s.type==="rest"){
    h+='<div class="card"><h3>'+esc(T(s.title))+'</h3><p class="note" style="margin-top:6px">'+esc(T(s.note)||"")+"</p></div>";
  }else{
    h+=hechoCard(dia||selDay(),s);
    var ordV=orderedIdx(sid,s.items);
    ordV.forEach(function(oi,pos){h+=exCard(sid,oi,s.items[oi],pos,s.items.length)});
    if(sid!=="manguito"&&sid!=="activo"&&shoulderUser())h+=painBlock();
    var saved=S("savedlog:"+TODAY+":"+sid,false);
    h+='<textarea class="note-in" rows="2" data-key="note:'+TODAY+":"+sid+'" placeholder="'+u("notePh")+'">'+esc(String(S("note:"+TODAY+":"+sid,"")))+"</textarea>";
    h+='<button class="donebtn'+(saved?" on":"")+'" data-act="savelog" data-sid="'+sid+'">'+(saved?u("savedSession"):u("saveSession"))+"</button>";
  }
  return h;
}

/* ---------- pestaña Rutina ----------
   La misma sesión que en Hoy y sobre las mismas claves (series, pesos, dolor,
   nota): lo único que cambia es el marco. Aquí no hay parte del día, journal ni
   métricas — solo la sesión, con la serie en curso pegada arriba y los
   ejercicios ya terminados plegados a una línea, de modo que la lista encoge
   según avanzas y lo siguiente que toca queda siempre a la vista. */
function rxIdx(){
  var WK=getWeek();
  if(state.rxSid){
    var k=WK.findIndex(function(w){return w.sid===state.rxSid});
    if(k>=0)return k;
  }
  return todayIdx;
}
function rxCount(sid){
  var s=getSession(sid);if(!s||!s.items)return {done:0,total:0};
  var st=S(setsKey(sid),{}),d=0,t=0;
  s.items.forEach(function(it,i){
    var ns=nSets(sid,i,it);if(!it.sets||!ns)return;
    var arr=st[i]||[];t+=ns;
    for(var j=0;j<ns;j++)if(arr[j])d++;
  });
  return {done:d,total:t};
}
function rxExDone(sid,i,it){
  var ns=nSets(sid,i,it);if(!it.sets||!ns)return false;
  var arr=S(setsKey(sid),{})[i]||[];
  for(var j=0;j<ns;j++)if(!arr[j])return false;
  return true;
}
/* Primera serie pendiente en el orden en que se ven los ejercicios. */
function rxFocus(sid){
  var s=getSession(sid);if(!s||!s.items)return null;
  var st=S(setsKey(sid),{}),out=null;
  orderedIdx(sid,s.items).some(function(i){
    var it=s.items[i],ns=nSets(sid,i,it);
    if(!it.sets||!ns)return false;
    var arr=st[i]||[];
    for(var j=0;j<ns;j++)if(!arr[j]){out={i:i,j:j,ns:ns,it:it};return true}
    return false;
  });
  return out;
}
function rxDoneRow(sid,i,it){
  var ns=nSets(sid,i,it),w=S("w:"+sid+":"+i,"");
  var rp=String(S("r:"+TODAY+":"+sid+":"+i,"")).trim()||estReps(T(it.reps))||T(it.reps);
  var det=ns+"×"+rp+(w?" · "+w+" "+u("kg"):"");
  return '<button class="rxdone" data-act="rxopen" data-sid="'+sid+'" data-i="'+i+'" aria-label="'+u("rxRe")+'">'+
    '<span class="rxv">✓</span><span class="rxt">'+esc(T(it.n))+'</span><span class="rxk">'+esc(det)+"</span></button>";
}
function rutinaView(){
  /* Un día puede llevar dos sesiones (campo `plus` en la semana): fuerza de
     torso junto al rodaje suave. Concentrar la carga en menos días protege los
     días de descanso de verdad, en vez de tener seis días a medio gas. El icono
     del selector lo marca con un punto. */
  var WK=getWeek(),idx=rxIdx(),dia=fechaDeIdx(idx);
  var wDia=diaDe(dia,WK[idx]),sid=wDia.sid,s=getSession(sid),h="";
  h+='<div class="rxdays">'+WK.map(function(w,i){
      var wi=diaDe(fechaDeIdx(i),w);
      var ws=getSession(wi.sid),ic=ws&&ws.type==="run"?"🏃":(ws&&ws.type==="rest"?"😴":"💪");
      if(wi.plus&&getSession(wi.plus))ic+='<i class="rxplus"></i>';
      var cls=i===idx?"sel":(isDone(wi.sid)?"done":"");
      return '<button data-act="rxday" data-sid="'+wi.sid+'"'+(cls?' class="'+cls+'"':"")+
        ' aria-label="'+esc(T(w.name))+'"><span class="rxi">'+ic+"</span>"+esc(T(w.d))+"</button>";
    }).join("")+"</div>";
  if(!s)return h;
  var extra=wDia.plus&&getSession(wDia.plus)?wDia.plus:null;
  /* Las pesas van primero: correr antes deja piernas y core cansados para
     estabilizar en el press. */
  var pre=extra?('<div class="card" style="border-left:3px solid var(--acc)"><div class="exhead"><div class="tlab">💪 '+
      esc(T(getSession(extra).title))+' <span class="snum">'+T(B("primero las pesas, después el rodaje","lift first, then run"))+
      "</span></div></div></div>"+
      (getSession(extra).items||[]).map(function(it,i){return exCard(extra,i,it,i,(getSession(extra).items||[]).length)}).join("")):"";
  if(s.type!=="gym")return h+pre+sessionView(sid,dia);

  var c=rxCount(sid),f=rxFocus(sid);
  var pct=c.total?Math.round(c.done/c.total*100):0;
  h+='<div class="rxnow'+(f?"":" fin")+'">'+
     (f?'<button class="rxl" data-act="rxjump" data-i="'+f.i+'" aria-label="'+u("rxJump")+'">'+
          '<span class="rxn">'+esc(T(f.it.n))+'</span>'+
          '<span class="rxc">'+u("serieLbl")+" "+(f.j+1)+"/"+f.ns+" · "+c.done+"/"+c.total+"</span></button>"
        :'<div class="rxl"><span class="rxn">'+u("sessDone")+'</span>'+
          '<span class="rxc">'+c.done+"/"+c.total+"</span></div>")+
     '<div class="rxbar"><i style="width:'+pct+'%"></i></div></div>';

  var exp=state.rxExp||{};
  orderedIdx(sid,s.items).forEach(function(oi,pos){
    var it=s.items[oi];
    if(rxExDone(sid,oi,it)&&!exp[sid+":"+oi])h+=rxDoneRow(sid,oi,it);
    else h+='<div class="rxw" id="rx-'+oi+'">'+exCard(sid,oi,it,pos,s.items.length)+"</div>";
  });
  if(sid!=="manguito"&&sid!=="activo"&&shoulderUser())h+=painBlock();
  var saved=S("savedlog:"+TODAY+":"+sid,false);
  h+='<textarea class="note-in" rows="2" data-key="note:'+TODAY+":"+sid+'" placeholder="'+u("notePh")+'">'+esc(String(S("note:"+TODAY+":"+sid,"")))+"</textarea>";
  h+='<button class="donebtn'+(saved?" on":"")+'" data-act="savelog" data-sid="'+sid+'">'+(saved?u("savedSession"):u("saveSession"))+"</button>";
  return h;
}

 ban:'<div class="card dcard"><h3>Banned this phase</h3><ul>'+
  "<li>Military press and all overhead pressing.</li><li>Dumbbell flys.</li>"+

  "<li><b>Hanging, even with feet supported.</b> Confirmed by Dr. Ana on 3 Aug 2026: not because of impingement, but because it <b>overloads the AC joint</b> — it opens the subacromial space but compresses the AC, and repeated rubbing can cause arthritis and osteophytes. What does open the space: rows, rotators and protractions. The bar stays as a band anchor.</li>"+

/* ---------- gráficas de la pestaña Carrera ----------
   Las genéricas de la app (colChart) son barras planas de un color: valen para
   un vistazo, no para mirar una tendencia doce semanas seguidas. Estas son SVG
   con degradado, curva suave y la última muestra destacada. */

/* Curva suave de Catmull-Rom pasada a Bézier: sin esto los picos hacen sierra. */
function suave(pts){
  if(pts.length<2)return "";
  var d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i?i-1:0],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6];
    var c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+="C"+c1[0].toFixed(1)+" "+c1[1].toFixed(1)+","+c2[0].toFixed(1)+" "+c2[1].toFixed(1)+
       ","+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return d;
}
/* pares: [etiqueta, valor]. opts.fmt formatea · opts.mejor "abajo"|"arriba"
   decide el color · opts.uid hace único el degradado (varios en la misma vista). */
function areaChart(pares,opts){
  opts=opts||{};
  var W=320,H=110,PL=8,PR=8,TOP=16,BASE=H-17;
  var vs=pares.map(function(p){return p[1]});
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(mx===mn){mx=mn+1;mn=mn-1}
  var pad=(mx-mn)*0.25;mn-=pad;mx+=pad;
  var n=pares.length,paso=n>1?(W-PL-PR)/(n-1):0;
  function X(i){return PL+paso*i}
  function Y(v){return BASE-(v-mn)/(mx-mn)*(BASE-TOP)}
  var pts=pares.map(function(p,i){return [X(i),Y(p[1])]});
  var col=opts.col||"#46C08A", uid=opts.uid||"g";
  var linea=suave(pts);
  var area=linea+"L"+X(n-1).toFixed(1)+" "+BASE+"L"+X(0).toFixed(1)+" "+BASE+"Z";
  var h='<svg viewBox="0 0 '+W+" "+H+'" style="width:100%;height:auto;margin:2px 0 0" preserveAspectRatio="none">'+
    '<defs><linearGradient id="ar'+uid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'" stop-opacity=".38"/>'+
    '<stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  /* dos líneas guía tenues, para dar escala sin ensuciar */
  [0.33,0.66].forEach(function(f){
    var y=(TOP+(BASE-TOP)*f).toFixed(1);
    h+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#2B3442" stroke-width="0.6" opacity=".55"/>';
  });
  h+='<path d="'+area+'" fill="url(#ar'+uid+')"/>'+
     '<path d="'+linea+'" fill="none" stroke="'+col+'" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(pt,i){
    var ult=i===n-1;
    h+='<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="'+(ult?4:2.6)+

  });

     '<text x="'+X(n-1).toFixed(1)+'" y="'+Math.max(11,Y(vs[n-1])-8).toFixed(1)+'" fill="'+col+

  return h+"</svg>";

/* Barras con punta redondeada y la última destacada. */
function barChart(pares,opts){
  opts=opts||{};

  var mx=Math.max.apply(null,pares.map(function(p){return p[1]}))||1;

  var f=opts.fmt||function(v){return v};
  var h='<svg viewBox="0 0 '+W+" "+H+'" style="width:100%;height:auto;margin:2px 0 0" preserveAspectRatio="none">'+
    '<defs><linearGradient id="bg'+(opts.uid||"b")+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'"/><stop offset="100%" stop-color="'+col+'" stop-opacity=".45"/>'+
    "</linearGradient></defs>";
  if(opts.meta!=null&&opts.meta<=mx){
    var ym=(BASE-(opts.meta/mx)*(BASE-TOP)).toFixed(1);
    h+='<line x1="'+PL+'" y1="'+ym+'" x2="'+(W-PR)+'" y2="'+ym+'" stroke="#8E99A8" stroke-width="0.9" stroke-dasharray="3 3" opacity=".7"/>';
  }
  pares.forEach(function(p,i){
